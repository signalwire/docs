name: fern-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install

      # Unit tests plus a compile of both real Relay specs (specs/relay/main-{server,client}.tsp)
      # into a temp dir. Builds only the emitter and its emit-filter dependency; writes nothing
      # under fern/.
      - name: Test Relay AsyncAPI emitter
        run: |
          yarn workspace signalwire-docs-specs build:emit-filter
          yarn workspace signalwire-docs-specs build:relay-emitter
          yarn workspace @signalwire/typespec-asyncapi test

      - name: Check API is valid
        run: yarn fern-check
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          
      - name: Check markdown content
        run: yarn fern-md-check
