<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Where a turn's time goes. The report gives three cumulative timings measured from the same start: latency at 814 milliseconds, utterance_latency at 937 milliseconds, and audio_latency at 1493 milliseconds. Subtracting each from the next yields the three segments you act on: 814 milliseconds of model time, 123 milliseconds of utterance assembly, and 556 milliseconds of audio delivery.">
  <g class="swlat-theme">
  <defs>
    <radialGradient id="swlat-orb-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.10"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="swlat-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="swlat-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
    </pattern>
    <clipPath id="swlat-card">
      <rect x="8" y="8" width="984" height="454" rx="20"/>
    </clipPath>
    <marker id="swlat-tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3.4" fill="currentColor"/>
    </marker>
    <style>
      /* THEMED variant — one file serving both modes, embedded as a plain img.
         The docs set color-scheme on html; it inherits to the img and the
         browser propagates it into this document, so the media query below
         tracks Fern's theme toggle rather than only the OS setting.

         Custom properties do not cross document boundaries, so nothing from the
         page reaches here. Every value is a literal brand hex, and because
         var() is invalid in SVG presentation attributes the mode-dependent
         values live as custom properties on .swlat-theme. */
      .swlat-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --swlat-ink: #070c2d;
        --swlat-chip: #044EF4;       /* SW Blue, matching accent-primary light */
        --swlat-mid: #601BE6;
        /* Deepened fuchsia so white label text clears 4.5:1 on the filled block;
           the brand tone is too light behind white at label sizes. */
        --swlat-model: #D91259;
        --swlat-on-seg: #ffffff;
        color: var(--swlat-ink);
      }
      @media (prefers-color-scheme: dark) {
        .swlat-theme {
          --swlat-ink: #f0f0f4;
          --swlat-chip: #40E0D0;     /* SW Turquoise, matching accent-primary dark */
          --swlat-mid: #9B6BFF;      /* lifted purple; #601BE6 goes muddy on dark */
          --swlat-model: #F72A72;
          /* Dark ink on the blocks: white fails against turquoise. */
          --swlat-on-seg: #0e0e18;
        }
      }
      .swlat-accent { fill: var(--sw-fuchsia); }
      .swlat-accent-stroke { stroke: var(--sw-fuchsia); }
      .swlat-seg-model { fill: var(--swlat-model); }
      .swlat-seg-utt { fill: var(--swlat-mid); }
      .swlat-seg-audio { fill: var(--swlat-chip); }
      .swlat-on-seg { fill: var(--swlat-on-seg); }
      .swlat-rule-model { stroke: var(--swlat-model); }
      .swlat-rule-utt { stroke: var(--swlat-mid); }
      .swlat-rule-audio { stroke: var(--swlat-chip); }
      #swlat-orb-purple stop { stop-color: var(--sw-purple); }
      #swlat-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .swlat-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .swlat-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      /* Field names sit in a left gutter, right-aligned and vertically centred
         on their own bar. Nothing stacks above a stroke, so no descender or
         underscore can collide with one. */
      .swlat-field { font-size: 13px; fill: currentColor; }
      .swlat-value { font-size: 13px; font-weight: 700; fill: currentColor; }
      .swlat-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: currentColor; fill-opacity: 0.55; }
      .swlat-rule { stroke-width: 6; stroke-linecap: round; }
    </style>
  </defs>

  <rect x="8" y="8" width="984" height="454" rx="20" fill="currentColor" fill-opacity="0.035"/>
  <g clip-path="url(#swlat-card)">
    <circle cx="900" cy="20" r="270" fill="url(#swlat-orb-purple)"/>
    <circle cx="80" cy="470" r="250" fill="url(#swlat-orb-fuchsia)"/>
    <rect x="8" y="8" width="984" height="454" fill="url(#swlat-dots)"/>
  </g>
  <rect x="8" y="8" width="984" height="454" rx="20" fill="none" stroke="currentColor" stroke-opacity="0.13" stroke-width="1.5"/>

  <line x1="40" y1="47" x2="64" y2="47" class="swlat-accent-stroke" stroke-width="2"/>
  <text x="72" y="52" class="swlat-mono swlat-accent" font-size="12" font-weight="700" letter-spacing="1.7">WHERE A TURN'S TIME GOES</text>
  <text x="960" y="52" text-anchor="end" class="swlat-mono" font-size="10.5" fill="currentColor" fill-opacity="0.5">MILLISECONDS →</text>

  <!-- ── Section A: the three cumulative timings the report carries ── -->
  <text x="40" y="106" class="swlat-mono swlat-eyebrow">THE REPORT GIVES YOU THREE CUMULATIVE TIMINGS</text>

  <!-- Shared origin at x=268, clear of the label gutter that ends at x=248. -->
  <text x="268" y="136" text-anchor="middle" class="swlat-mono" font-size="10.5" fill="currentColor" fill-opacity="0.62">TURN STARTS</text>
  <line x1="268" y1="148" x2="268" y2="284" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="248" y="175" text-anchor="end" class="swlat-mono swlat-field">latency</text>
  <line x1="268" y1="170" x2="589" y2="170" class="swlat-rule swlat-rule-model" marker-end="url(#swlat-tick)"/>
  <text x="605" y="175" class="swlat-mono swlat-value">814</text>

  <text x="248" y="219" text-anchor="end" class="swlat-mono swlat-field">utterance_latency</text>
  <line x1="268" y1="214" x2="638" y2="214" class="swlat-rule swlat-rule-utt" marker-end="url(#swlat-tick)"/>
  <text x="654" y="219" class="swlat-mono swlat-value">937</text>

  <text x="248" y="263" text-anchor="end" class="swlat-mono swlat-field">audio_latency</text>
  <line x1="268" y1="258" x2="858" y2="258" class="swlat-rule swlat-rule-audio" marker-end="url(#swlat-tick)"/>
  <text x="874" y="263" class="swlat-mono swlat-value">1493</text>

  <line x1="40" y1="312" x2="960" y2="312" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ── Section B: the gaps between them, which are what you act on ── -->
  <text x="40" y="348" class="swlat-mono swlat-eyebrow">SUBTRACT TO GET THE SEGMENTS YOU ACT ON</text>

  <line x1="268" y1="360" x2="268" y2="414" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="268" y="364" width="321" height="46" rx="7" class="swlat-seg-model"/>
  <rect x="591" y="364" width="47" height="46" rx="7" class="swlat-seg-utt"/>
  <rect x="640" y="364" width="218" height="46" rx="7" class="swlat-seg-audio"/>

  <text x="428" y="386" text-anchor="middle" class="swlat-hd swlat-on-seg" font-size="14" font-weight="600">Model</text>
  <text x="428" y="402" text-anchor="middle" class="swlat-mono swlat-on-seg" font-size="11.5" fill-opacity="0.85">814 ms</text>

  <text x="749" y="386" text-anchor="middle" class="swlat-hd swlat-on-seg" font-size="14" font-weight="600">Audio delivery</text>
  <text x="749" y="402" text-anchor="middle" class="swlat-mono swlat-on-seg" font-size="11.5" fill-opacity="0.85">556 ms</text>

  <!-- The utterance slice is too narrow for an inside label; call it out beneath. -->
  <line x1="614" y1="414" x2="614" y2="428" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="614" y="444" text-anchor="middle" class="swlat-hd" font-size="12.5" font-weight="600" fill="currentColor">Utterance 123 ms</text>

  </g>
</svg>
