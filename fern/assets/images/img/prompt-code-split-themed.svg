<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="What belongs in the prompt and what belongs in your code. The prompt, fixed when the call starts, carries identity and tone, scope and duties, and the list of tools the agent can call. Your code, current at call time, carries knowledge and data, retrieval results, and business logic. The agent makes a function call to your code, and your code returns the exact value from your system of record.">
  <g class="pcs-theme">
  <defs>
    <radialGradient id="pcs-orb-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.10"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pcs-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pcs-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
    </pattern>
    <clipPath id="pcs-card">
      <rect x="8" y="8" width="984" height="544" rx="20"/>
    </clipPath>
    <!-- refX=1 anchors the arrow BASE at the path end so animated dashes stop
         under the head instead of poking past the tip; every marked path is
         drawn ~10px short (the arrow's rendered length) to compensate. -->
    <marker id="pcs-arrow-f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" class="pcs-accent"/>
    </marker>
    <style>
      /* THEMED — one file for both modes, embedded as a single plain img tag,
         with no .light-only / .dark-only pair.

         How it follows the site theme: the docs set `color-scheme` on the html
         element (light or dark, per Fern's theme toggle), that inherits down to
         the img element, and the browser propagates the embedding element's
         color-scheme into the SVG image's own document — so the media query
         below tracks the site toggle rather than the visitor's OS setting.
         Where a browser hasn't implemented that propagation, the query falls
         back to the OS preference, which is what the toggle defaults to anyway.

         The colors are literal brand hexes rather than Fern's --accent /
         --grayscale-* variables: custom properties do not cross document
         boundaries, so nothing from the page reaches an img-embedded SVG. Both
         modes live in this one file instead, which is the point.

         var() is invalid in SVG presentation attributes, so colored
         fills/strokes go through the classes below; the mode-dependent values
         are the custom properties on .pcs-theme. */
      .pcs-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --pcs-ink: #070c2d;
        --pcs-chip: #044EF4;      /* SW Blue, matching accent-primary light */
        --pcs-on-chip: #ffffff;
        color: var(--pcs-ink);
      }
      @media (prefers-color-scheme: dark) {
        .pcs-theme {
          --pcs-ink: #f0f0f4;
          --pcs-chip: #40E0D0;    /* SW Turquoise, matching accent-primary dark */
          --pcs-on-chip: #0e0e18;
        }
      }
      .pcs-accent { fill: var(--sw-fuchsia); }
      .pcs-accent-stroke { stroke: var(--sw-fuchsia); }
      .pcs-chip { fill: var(--pcs-chip); }
      .pcs-glyph { fill: var(--pcs-on-chip); }
      .pcs-glyph-stroke { fill: none; stroke: var(--pcs-on-chip); stroke-linecap: round; }
      #pcs-orb-purple stop { stop-color: var(--sw-purple); }
      #pcs-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .pcs-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .pcs-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .pcs-dash { stroke: var(--sw-fuchsia); stroke-width: 2; stroke-dasharray: 12 6; animation: pcs-dashmove 1.8s linear infinite; }
      @keyframes pcs-dashmove { to { stroke-dashoffset: -36; } }
      @media (prefers-reduced-motion: reduce) { .pcs-dash { animation: none; } }
    </style>
  </defs>

