<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 986" width="1000" height="986" role="img" aria-label="Scheduling a meeting through SWAIG functions: the agent checks team availability against the calendar API, books the meeting, triggers a confirmation SMS, and tells the caller what was booked.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <line x1="148" y1="110" x2="148" y2="128" class="sw-tie"/>
  <line x1="148" y1="168" x2="148" y2="245" class="sw-tie"/>
  <line x1="148" y1="285" x2="148" y2="301" class="sw-tie"/>
  <line x1="148" y1="341" x2="148" y2="517" class="sw-tie"/>
  <line x1="148" y1="557" x2="148" y2="941" class="sw-tie"/>
  <line x1="148" y1="996" x2="148" y2="1000" class="sw-tie"/>
  <rect x="100" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="148" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="324" y1="110" x2="324" y2="128" class="sw-tie"/>
  <line x1="324" y1="168" x2="324" y2="184" class="sw-tie"/>
  <line x1="324" y1="239" x2="324" y2="245" class="sw-tie"/>
  <line x1="324" y1="285" x2="324" y2="301" class="sw-tie"/>
  <line x1="324" y1="341" x2="324" y2="357" class="sw-tie"/>
  <line x1="324" y1="381" x2="324" y2="517" class="sw-tie"/>
  <line x1="324" y1="557" x2="324" y2="941" class="sw-tie"/>
  <line x1="324" y1="996" x2="324" y2="1000" class="sw-tie"/>
  <rect x="276" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="324" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">AI agent</text>
  <line x1="500" y1="110" x2="500" y2="357" class="sw-tie"/>
  <line x1="500" y1="381" x2="500" y2="397" class="sw-tie"/>
  <line x1="500" y1="421" x2="500" y2="709" class="sw-tie"/>
  <line x1="500" y1="749" x2="500" y2="1000" class="sw-tie"/>
  <rect x="449" y="78" width="102" height="32" rx="16" class="sw-chip-fill"/>
  <text x="500" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Functions</text>
  <line x1="676" y1="110" x2="676" y2="397" class="sw-tie"/>
  <line x1="676" y1="421" x2="676" y2="709" class="sw-tie"/>
  <line x1="676" y1="749" x2="676" y2="765" class="sw-tie"/>
  <line x1="676" y1="789" x2="676" y2="805" class="sw-tie"/>
  <line x1="676" y1="829" x2="676" y2="1000" class="sw-tie"/>
  <rect x="613" y="78" width="127" height="32" rx="16" class="sw-chip-fill"/>
  <text x="676" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Calendar API</text>
  <line x1="852" y1="110" x2="852" y2="1000" class="sw-tie"/>
  <rect x="804" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="852" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">SMS</text>
  <text x="236" y="143" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I need to schedule a</text>
  <text x="236" y="159" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">meeting with the sales team&quot;</text>
  <line x1="148" y1="172" x2="316" y2="172" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="176" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <rect x="227" y="188" width="194" height="47" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="227" y="188" width="194" height="47" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="227" y1="198" x2="227" y2="225" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="324" y="208" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">Detects scheduling</text>
  <text x="324" y="224" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">intent</text>
  <text x="236" y="260" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I can help. When is best</text>
  <text x="236" y="276" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">for you next week?&quot;</text>
  <line x1="324" y1="289" x2="156" y2="289" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="293" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <text x="236" y="316" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;Tuesday afternoon would be</text>
  <text x="236" y="332" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">great&quot;</text>
  <line x1="148" y1="345" x2="316" y2="345" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="349" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <text x="412" y="372" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">check_team_availability()</text>
  <line x1="324" y1="385" x2="492" y2="385" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="389" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">4</text>
  <text x="588" y="412" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Query sales team calendar</text>
  <line x1="500" y1="425" x2="668" y2="425" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="429" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">5</text>
  <text x="588" y="452" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Return available slots</text>
  <line x1="676" y1="465" x2="508" y2="465" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="469" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">6</text>
  <text x="412" y="492" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Provide available times</text>
  <line x1="500" y1="505" x2="332" y2="505" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="509" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">7</text>
  <text x="236" y="532" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;The sales team is free at 2</text>
  <text x="236" y="548" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">PM or 4 PM on Tuesday&quot;</text>
  <line x1="324" y1="561" x2="156" y2="561" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="565" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">8</text>
  <text x="236" y="588" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;2 PM works perfectly&quot;</text>
  <line x1="148" y1="601" x2="316" y2="601" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="605" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">9</text>
  <text x="412" y="628" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">schedule_meeting()</text>
  <line x1="324" y1="641" x2="492" y2="641" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="645" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">10</text>
  <text x="588" y="668" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Create event and send</text>
  <text x="588" y="684" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">invites</text>
  <line x1="500" y1="697" x2="668" y2="697" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="701" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">11</text>
  <text x="588" y="724" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Confirm booking and invites</text>
  <text x="588" y="740" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">sent</text>
  <line x1="676" y1="753" x2="508" y2="753" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="757" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">12</text>
  <text x="676" y="780" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Send confirmation text</text>
  <line x1="500" y1="793" x2="844" y2="793" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="797" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">13</text>
  <text x="676" y="820" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Confirm delivery status</text>
  <line x1="852" y1="833" x2="508" y2="833" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="837" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">14</text>
  <text x="412" y="860" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Confirm meeting setup</text>
  <line x1="500" y1="873" x2="332" y2="873" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="877" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">15</text>
  <text x="236" y="900" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;Meeting scheduled for</text>
  <text x="236" y="916" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Tuesday at 2 PM&quot;</text>
  <line x1="324" y1="929" x2="156" y2="929" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="933" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">16</text>
  <rect x="51" y="945" width="370" height="47" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="51" y="945" width="370" height="47" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="51" y1="955" x2="51" y2="982" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="236" y="965" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">The caller gets a calendar invite and a</text>
  <text x="236" y="981" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">confirmation SMS</text>
  </g>
  </g>
</svg>
