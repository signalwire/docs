<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 960" width="680" height="960" role="img" aria-labelledby="aichat-title aichat-desc">
  <title id="aichat-title">An AI chat conversation over the REST API</title>
  <desc id="aichat-desc">Your server sends create_conversation with an id and config_url. SignalWire fetches your agent's SWML document from config_url and returns the agent's greeting as initial_message. On each turn, your server sends chat with the id and message. If the agent calls a tool, SignalWire posts the tool call to your web_hook_url and your server returns the result. SignalWire returns the agent's reply as response. Your server sends end_conversation, SignalWire returns status ended, then posts the summary to your post_prompt_url.</desc>
  <g class="swflow-theme">
  <defs>
    <style>
      .swflow-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --swflow-ink: #070c2d;
        --swflow-chip: #044EF4;
        --swflow-on-chip: #ffffff;
        color: var(--swflow-ink);
        font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
        font-size: 24px;
      }
      @media (prefers-color-scheme: dark) {
        .swflow-theme {
          --swflow-ink: #f0f0f4;
          --swflow-chip: #40E0D0;
          --swflow-on-chip: #0e0e18;
        }
      }
      .swflow-chip { fill: var(--swflow-chip); }
      .swflow-on-chip { fill: var(--swflow-on-chip); }
      .swflow-accent { fill: var(--sw-fuchsia); }
      .swflow-panel { fill: currentColor; fill-opacity: 0.03; stroke: currentColor; stroke-opacity: 0.12; }
      .swflow-node { fill: currentColor; fill-opacity: 0.065; stroke: currentColor; stroke-opacity: 0.16; }
      .swflow-note { fill: var(--sw-purple); fill-opacity: 0.08; stroke: var(--sw-purple); stroke-opacity: 0.45; }
      .swflow-lifeline { stroke: currentColor; stroke-opacity: 0.22; stroke-width: 1.5; stroke-dasharray: 2 6; }
      .swflow-action, .swflow-return { fill: none; stroke: var(--sw-fuchsia); stroke-width: 2; }
      .swflow-return { stroke-dasharray: 6 6; }
      text { fill: currentColor; text-anchor: middle; }
      .swflow-title { font-size: 22px; font-weight: 600; }
      .swflow-label { font-weight: 600; }
      .swflow-detail { font-size: 22px; }
      .swflow-loop { font-size: 20px; font-weight: 600; text-anchor: start; }
    </style>
    <marker id="swflow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 8 5 0 9z" class="swflow-accent"/>
    </marker>
  </defs>
    <rect x="4" y="4" width="672" height="952" rx="18" class="swflow-panel"/>

    <!-- Each-turn loop, drawn first so lifelines and arrows sit on top -->
    <rect x="16" y="388" width="462" height="306" rx="12" class="swflow-note"/>
    <text x="32" y="416" class="swflow-loop">Each turn</text>

    <!-- Participants -->
    <line x1="100" y1="114" x2="100" y2="940" class="swflow-lifeline"/>
    <rect x="22" y="22" width="156" height="92" rx="12" class="swflow-node"/>
    <rect x="78" y="32" width="44" height="40" rx="10" class="swflow-chip"/>
    <svg x="86" y="38" width="28" height="28" viewBox="0 0 576 512"><path class="swflow-on-chip" d="M205.1 225.5L138.7 344.4c-19.6 2.6-34.7 19.4-34.7 39.6 0 22.1 17.9 40 40 40s40-17.9 40-40c0-5.8-1.2-11.3-3.4-16.2l76.9-137.6c6.4-11.5 2.4-26.1-9.1-32.6-30.4-17.3-46.9-53.3-38-88.9 10.7-42.9 54.1-69 97-58.3 35.6 8.9 59.7 40.3 60.6 75.3 .4 13.2 11.4 23.7 24.7 23.3s23.7-11.4 23.3-24.7c-1.6-56-40-106.3-97-120.5-68.6-17.1-138.1 24.7-155.2 93.3-12.2 48.8 5.5 98 41.3 128.5zm119.5-81.4c2.2-4.9 3.4-10.4 3.4-16.1 0-22.1-17.9-40-40-40s-40 17.9-40 40c0 20.3 15.2 37.1 34.8 39.7l77.3 137.4c3.1 5.5 8.3 9.6 14.5 11.3s12.7 .9 18.2-2.2c30.5-17.2 69.9-12.7 95.8 13.2 31.2 31.2 31.2 81.9 0 113.1-25.9 25.9-65.3 30.4-95.8 13.2-11.5-6.5-26.2-2.4-32.7 9.1s-2.4 26.2 9.1 32.7c48.8 27.5 111.7 20.5 153.3-21.1 50-50 50-131 0-181-35.5-35.5-86.7-45.8-131.2-30.9L324.6 144.1zM432 424c22.1 0 40-17.9 40-40s-17.9-40-40-40c-13.1 0-24.7 6.3-32 16l-152 0c-6.4 0-12.5 2.5-17 7s-7 10.6-7 17c0 34.8-22.9 66.8-58 76.9-42.5 12.2-86.8-12.4-99-54.9-10.1-35.3 5.1-71.8 34.9-90.2 11.3-6.9 14.8-21.7 7.9-33s-21.7-14.8-33-7.9c-47.7 29.3-72.1 87.8-55.9 144.3 19.5 68 90.4 107.2 158.3 87.8 48-13.8 81.7-53.2 90.5-99L400 408c7.3 9.7 18.9 16 32 16z"/></svg>
    <text x="100" y="98" class="swflow-title">Your server</text>

    <line x1="380" y1="114" x2="380" y2="940" class="swflow-lifeline"/>
    <rect x="302" y="22" width="156" height="92" rx="12" class="swflow-node"/>
    <rect x="358" y="32" width="44" height="40" rx="10" class="swflow-chip"/>
    <svg x="366" y="38" width="28" height="28" viewBox="0 0 576 512"><path class="swflow-on-chip" d="M248 0c13.3 0 24 10.7 24 24l0 464c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-464c0-13.3 10.7-24 24-24zM440 64c13.3 0 24 10.7 24 24l0 336c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-336c0-13.3 10.7-24 24-24zM152 96c13.3 0 24 10.7 24 24l0 272c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-272c0-13.3 10.7-24 24-24zm192 32c13.3 0 24 10.7 24 24l0 208c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-208c0-13.3 10.7-24 24-24zM56 192c13.3 0 24 10.7 24 24l0 80c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-80c0-13.3 10.7-24 24-24zm480 0c13.3 0 24 10.7 24 24l0 80c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-80c0-13.3 10.7-24 24-24z"/></svg>
    <text x="380" y="98" class="swflow-title">SignalWire</text>

    <line x1="590" y1="114" x2="590" y2="940" class="swflow-lifeline"/>
    <rect x="512" y="22" width="156" height="92" rx="12" class="swflow-node"/>
    <rect x="568" y="32" width="44" height="40" rx="10" class="swflow-chip"/>
    <svg x="576" y="38" width="28" height="28" viewBox="0 -32 640 544"><path class="swflow-on-chip" d="M344-8c0-13.3-10.7-24-24-24S296-21.3 296-8l0 72-104 0c-53 0-96 43-96 96l0 224c0 53 43 96 96 96l256 0c53 0 96-43 96-96l0-224c0-53-43-96-96-96l-104 0 0-72zM320 112l128 0c26.5 0 48 21.5 48 48l0 224c0 26.5-21.5 48-48 48l-256 0c-26.5 0-48-21.5-48-48l0-224c0-26.5 21.5-48 48-48l128 0zM176 360c0 13.3 10.7 24 24 24l32 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-32 0c-13.3 0-24 10.7-24 24zm112 0c0 13.3 10.7 24 24 24l16 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-16 0c-13.3 0-24 10.7-24 24zm96 0c0 13.3 10.7 24 24 24l32 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-32 0c-13.3 0-24 10.7-24 24zM240 288a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm208-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM48 216c0-13.3-10.7-24-24-24S0 202.7 0 216L0 328c0 13.3 10.7 24 24 24s24-10.7 24-24l0-112zm568-24c-13.3 0-24 10.7-24 24l0 112c0 13.3 10.7 24 24 24s24-10.7 24-24l0-112c0-13.3-10.7-24-24-24z"/></svg>
    <text x="590" y="98" class="swflow-title">Your agent</text>

    <!-- Create the conversation -->
    <text x="240" y="146" class="swflow-label">create_conversation</text>
    <text x="240" y="172" class="swflow-detail">id, config_url</text>
    <path d="M100 186 H376" class="swflow-action" marker-end="url(#swflow-arrow)"/>

    <text x="485" y="222" class="swflow-label">fetch agent</text>
    <path d="M380 236 H586" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <text x="485" y="272" class="swflow-label">SWML document</text>
    <path d="M590 286 H384" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <text x="240" y="322" class="swflow-label">initial_message</text>
    <text x="240" y="348" class="swflow-detail">the agent's greeting</text>
    <path d="M380 360 H104" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <!-- One turn -->
    <text x="240" y="446" class="swflow-label">chat</text>
    <text x="240" y="472" class="swflow-detail">id, message</text>
    <path d="M100 486 H376" class="swflow-action" marker-end="url(#swflow-arrow)"/>

    <text x="240" y="522" class="swflow-label">tool call, if any</text>
    <text x="240" y="548" class="swflow-detail">to web_hook_url</text>
    <path d="M380 562 H104" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <text x="240" y="594" class="swflow-label">result</text>
    <path d="M100 608 H376" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <text x="240" y="638" class="swflow-label">response</text>
    <text x="240" y="664" class="swflow-detail">the agent's reply</text>
    <path d="M380 676 H104" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <!-- End the conversation -->
    <text x="240" y="730" class="swflow-label">end_conversation</text>
    <text x="240" y="756" class="swflow-detail">id</text>
    <path d="M100 770 H376" class="swflow-action" marker-end="url(#swflow-arrow)"/>

    <text x="240" y="806" class="swflow-label">ended</text>
    <text x="240" y="832" class="swflow-detail">status</text>
    <path d="M380 846 H104" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <text x="240" y="882" class="swflow-label">summary</text>
    <text x="240" y="908" class="swflow-detail">to post_prompt_url</text>
    <path d="M380 922 H104" class="swflow-action" marker-end="url(#swflow-arrow)"/>
  </g>
</svg>
