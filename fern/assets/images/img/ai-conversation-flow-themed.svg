<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 583" width="1000" height="583" role="img" aria-label="Scheduling the same appointment with an AI agent: a handful of natural exchanges, several details handled per turn, and a mid-flow question about the cancellation policy answered without losing the booking.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <line x1="280" y1="110" x2="280" y2="597" class="sw-tie"/>
  <rect x="232" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="280" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="720" y1="110" x2="720" y2="168" class="sw-tie"/>
  <line x1="720" y1="207" x2="720" y2="293" class="sw-tie"/>
  <line x1="720" y1="332" x2="720" y2="418" class="sw-tie"/>
  <line x1="720" y1="457" x2="720" y2="597" class="sw-tie"/>
  <rect x="672" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="720" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">AI agent</text>
  <text x="500" y="143" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I need to schedule a cardiology appointment&quot;</text>
  <line x1="280" y1="156" x2="712" y2="156" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="160" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <rect x="478" y="172" width="482" height="31" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="478" y="172" width="482" height="31" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="478" y1="182" x2="478" y2="193" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="719" y="192" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">One turn: scheduling intent, specialty, new appointment</text>
  <text x="500" y="228" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I can help with that. Morning or afternoon?&quot;</text>
  <line x1="720" y1="241" x2="288" y2="241" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="245" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <text x="500" y="268" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;Morning would be better&quot;</text>
  <line x1="280" y1="281" x2="712" y2="281" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="285" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <rect x="478" y="297" width="482" height="31" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="478" y="297" width="482" height="31" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="478" y1="307" x2="478" y2="318" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="719" y="317" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">Checks open slots and doctor availability</text>
  <text x="500" y="353" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;Dr. Smith has Tuesday at 9AM or Thursday at 10AM&quot;</text>
  <line x1="720" y1="366" x2="288" y2="366" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="370" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">4</text>
  <text x="500" y="393" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;What&#x27;s the cancellation policy?&quot;</text>
  <line x1="280" y1="406" x2="712" y2="406" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="410" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">5</text>
  <rect x="478" y="422" width="482" height="31" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="478" y="422" width="482" height="31" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="478" y1="432" x2="478" y2="443" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="719" y="442" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">Answers the aside, keeps the booking in flight</text>
  <text x="500" y="478" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;You can cancel up to 24 hours before. Want one of those</text>
  <text x="500" y="494" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">slots?&quot;</text>
  <line x1="720" y1="507" x2="288" y2="507" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="511" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">6</text>
  <text x="500" y="534" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;Yes, Tuesday at 9AM&quot;</text>
  <line x1="280" y1="547" x2="712" y2="547" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="551" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">7</text>
  <text x="500" y="574" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;Booked: cardiology, Tuesday at 9AM with Dr. Smith&quot;</text>
  <line x1="720" y1="587" x2="288" y2="587" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="591" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">8</text>
  </g>
  </g>
</svg>
