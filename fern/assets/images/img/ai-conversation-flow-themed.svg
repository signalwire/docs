<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1159" width="1000" height="1159" role="img" aria-label="Scheduling the same appointment with an AI agent: five natural exchanges, several details handled per turn, and a mid-flow question about the cancellation policy answered without losing the booking.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <line x1="280" y1="126" x2="280" y2="1149" class="sw-tie"/>
  <rect x="232" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="280" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="720" y1="126" x2="720" y2="1149" class="sw-tie"/>
  <rect x="672" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="720" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">AI agent</text>
  <text x="500" y="172" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Calls clinic</text>
  <line x1="280" y1="190" x2="711" y2="190" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="194" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <rect x="535" y="216" width="370" height="35" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="535" y="216" width="370" height="35" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="535" y1="226" x2="535" y2="241" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="231" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Understands natural speech</text>
  <text x="500" y="287" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;Hello, how can I help you today?&quot;</text>
  <line x1="720" y1="305" x2="289" y2="305" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="309" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <text x="500" y="343" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;I need to schedule a cardiology appointment&quot;</text>
  <line x1="280" y1="361" x2="711" y2="361" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="365" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <rect x="535" y="387" width="370" height="52" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="535" y="387" width="370" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="535" y1="397" x2="535" y2="429" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="402" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Identifies at once: appointment scheduling,</text>
  <text x="720" y="419" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">specialist type, new appointment</text>
  <text x="500" y="475" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;I can help you schedule that. Would you prefer morning</text>
  <text x="500" y="493" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">or afternoon appointments?&quot;</text>
  <line x1="720" y1="511" x2="289" y2="511" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="515" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">4</text>
  <text x="500" y="549" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;Morning would be better&quot;</text>
  <line x1="280" y1="567" x2="711" y2="567" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="571" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">5</text>
  <rect x="535" y="593" width="370" height="52" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="535" y="593" width="370" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="535" y1="603" x2="535" y2="635" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="608" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Processes multiple criteria: time preference,</text>
  <text x="720" y="625" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">available slots, doctor availability</text>
  <text x="500" y="681" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;I have morning slots available with Dr. Smith next</text>
  <text x="500" y="699" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Tuesday at 9AM or Thursday at 10AM&quot;</text>
  <line x1="720" y1="717" x2="289" y2="717" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="721" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">6</text>
  <text x="500" y="755" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;What&#x27;s the cancellation policy?&quot;</text>
  <line x1="280" y1="773" x2="711" y2="773" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="777" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">7</text>
  <rect x="535" y="799" width="370" height="52" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="535" y="799" width="370" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="535" y1="809" x2="535" y2="841" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="814" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Handles the context switch while</text>
  <text x="720" y="831" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">keeping the booking flow</text>
  <text x="500" y="887" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;You can cancel up to 24 hours before your appointment.</text>
  <text x="500" y="905" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Would you like one of those morning slots?&quot;</text>
  <line x1="720" y1="923" x2="289" y2="923" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="927" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">8</text>
  <text x="500" y="961" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;Yes, I&#x27;ll take Tuesday at 9AM&quot;</text>
  <line x1="280" y1="979" x2="711" y2="979" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="983" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">9</text>
  <rect x="535" y="1005" width="370" height="52" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="535" y="1005" width="370" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="535" y1="1015" x2="535" y2="1047" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="1020" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Completes the booking while keeping</text>
  <text x="720" y="1037" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">conversation context</text>
  <text x="500" y="1093" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;Perfect, I&#x27;ve scheduled your cardiology appointment for</text>
  <text x="500" y="1111" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Tuesday at 9AM with Dr. Smith&quot;</text>
  <line x1="720" y1="1129" x2="289" y2="1129" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="1133" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">10</text>
  <text x="500.0" y="1187" text-anchor="middle" class="sw-mono" font-size="11.5" letter-spacing="1.1" fill="currentColor" fill-opacity="0.5">5 exchanges · several details per turn · questions welcome mid-flow</text>
  </g>
  </g>
</svg>
