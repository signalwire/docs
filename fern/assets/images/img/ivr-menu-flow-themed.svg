<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 912" width="1000" height="912" role="img" aria-label="Scheduling an appointment through a traditional IVR: every question needs its own menu and its own keypress, the menus for specialty, day, and time repeat the same pattern, and asking about the cancellation policy means returning to the menu to confirm.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <line x1="280" y1="126" x2="280" y2="926" class="sw-tie"/>
  <rect x="232" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="280" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="720" y1="126" x2="720" y2="926" class="sw-tie"/>
  <rect x="665" y="92" width="110" height="34" rx="17" class="sw-chip-fill"/>
  <text x="720" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">IVR system</text>
  <text x="500" y="172" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Calls clinic</text>
  <line x1="280" y1="190" x2="712" y2="190" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="194" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <text x="500" y="224" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;Press 1 for appointments, 2 for billing...&quot;</text>
  <line x1="720" y1="242" x2="288" y2="242" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="246" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <text x="500" y="276" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Presses &quot;1&quot;</text>
  <line x1="280" y1="294" x2="712" y2="294" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="298" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <rect x="478" y="316" width="482" height="35" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="478" y="316" width="482" height="35" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="478" y1="326" x2="478" y2="341" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="719" y="331" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Selected: appointments · start input collection</text>
  <text x="500" y="383" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;Press 1 for a new appointment, 2 to modify...&quot;</text>
  <line x1="720" y1="401" x2="288" y2="401" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="405" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">4</text>
  <text x="500" y="435" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Presses &quot;1&quot;</text>
  <line x1="280" y1="453" x2="712" y2="453" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="457" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">5</text>
  <rect x="478" y="475" width="482" height="52" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="478" y="475" width="482" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="478" y1="485" x2="478" y2="517" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="719" y="490" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Four more menus, same pattern: general or specialist,</text>
  <text x="719" y="507" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">which specialty, morning or afternoon, which slot</text>
  <text x="500" y="559" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Presses &quot;1&quot; · Tuesday 9AM</text>
  <line x1="280" y1="577" x2="712" y2="577" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="581" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">6</text>
  <text x="500" y="611" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;For the cancellation policy press 1, to confirm press</text>
  <text x="500" y="629" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">2...&quot;</text>
  <line x1="720" y1="647" x2="288" y2="647" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="651" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">7</text>
  <text x="500" y="681" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Presses &quot;1&quot;</text>
  <line x1="280" y1="699" x2="712" y2="699" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="703" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">8</text>
  <text x="500" y="733" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;You may cancel up to 24 hours before your appointment.&quot;</text>
  <line x1="720" y1="751" x2="288" y2="751" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="755" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">9</text>
  <rect x="478" y="773" width="482" height="35" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="478" y="773" width="482" height="35" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="478" y1="783" x2="478" y2="798" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="719" y="788" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Back to the menu to confirm</text>
  <text x="500" y="840" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Presses &quot;1&quot;</text>
  <line x1="280" y1="858" x2="712" y2="858" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="862" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">10</text>
  <text x="500" y="892" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;Scheduled for Tuesday at 9AM with Dr. Smith.&quot;</text>
  <line x1="720" y1="910" x2="288" y2="910" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="914" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">11</text>
  </g>
  </g>
</svg>
