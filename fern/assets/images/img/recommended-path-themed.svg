<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-labelledby="path-title path-desc">
  <title id="path-title">The recommended path: SWML and REST API from your stack</title>
  <desc id="path-desc">A caller on a phone, SIP, or a browser reaches a phone number or Address, which points at a Resource, an External SWML script. The Resource fetches SWML from your stack, written with the Server SDKs Agents namespace, and the live call runs on SignalWire. The SWML makes SWAIG tool calls to your systems. The REST API, used through the Server SDKs REST namespace, sends call commands over HTTP to the live call, and manages numbers, Resources, and tokens in your Space configuration.</desc>
  <g class="swflow-theme">
  <defs>
    <style>
      .swflow-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --swflow-ink: #070c2d;
        color: var(--swflow-ink);
        font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .swflow-theme {
          --swflow-ink: #f0f0f4;
        }
      }
      .swflow-accent { fill: var(--sw-fuchsia); }
      .swflow-frame { fill: currentColor; fill-opacity: 0.03; stroke: currentColor; stroke-opacity: 0.12; }
      .swflow-panel { fill: currentColor; fill-opacity: 0.025; stroke: currentColor; stroke-opacity: 0.12; stroke-width: 1.5; }
      .swflow-node { fill: currentColor; fill-opacity: 0.065; stroke: currentColor; stroke-opacity: 0.16; stroke-width: 1.5; }
      .swflow-note { fill: var(--sw-purple); fill-opacity: 0.08; stroke: var(--sw-purple); stroke-opacity: 0.45; stroke-width: 1.5; }
      .swflow-divider { stroke: currentColor; stroke-opacity: 0.16; stroke-width: 1.5; }
      .swflow-action { fill: none; stroke: var(--sw-fuchsia); stroke-width: 2; }
      text { fill: currentColor; text-anchor: middle; }
      .swflow-panelhead { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill-opacity: 0.6; text-anchor: start; }
      .swflow-title { font-size: 20px; font-weight: 600; }
      .swflow-sub { font-size: 16px; fill-opacity: 0.62; }
      .swflow-label { font-size: 16px; font-weight: 600; }
      .swflow-start { text-anchor: start; }
    </style>
    <marker id="swflow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 8 5 0 9z" class="swflow-accent"/>
    </marker>
  </defs>
    <rect x="4" y="4" width="872" height="612" rx="18" class="swflow-frame"/>

    <rect x="44" y="24" width="300" height="72" rx="12" class="swflow-node"/>
    <text x="194" y="55" class="swflow-title">Caller</text>
    <text x="194" y="79" class="swflow-sub">Phone · SIP · browser</text>

    <rect x="24" y="120" width="340" height="480" rx="16" class="swflow-panel"/>
    <text x="44" y="150" class="swflow-panelhead">SIGNALWIRE</text>

    <rect x="516" y="120" width="340" height="480" rx="16" class="swflow-panel"/>
    <text x="536" y="150" class="swflow-panelhead">YOUR STACK</text>

    <rect x="44" y="172" width="300" height="72" rx="12" class="swflow-node"/>
    <text x="194" y="203" class="swflow-title">Phone number or Address</text>
    <text x="194" y="227" class="swflow-sub">Points at a Resource</text>

    <rect x="44" y="284" width="300" height="72" rx="12" class="swflow-node"/>
    <text x="194" y="315" class="swflow-title">Resource</text>
    <text x="194" y="339" class="swflow-sub">External SWML script</text>

    <rect x="44" y="396" width="300" height="72" rx="12" class="swflow-note"/>
    <text x="194" y="427" class="swflow-title">Live call</text>
    <text x="194" y="451" class="swflow-sub">SignalWire runs your SWML</text>

    <rect x="44" y="508" width="300" height="72" rx="12" class="swflow-node"/>
    <text x="194" y="551" class="swflow-title">Space configuration</text>

    <rect x="536" y="172" width="300" height="72" rx="12" class="swflow-node"/>
    <text x="686" y="203" class="swflow-title">Your systems</text>
    <text x="686" y="227" class="swflow-sub">Data · rules</text>

    <rect x="536" y="284" width="300" height="184" rx="12" class="swflow-node"/>
    <text x="686" y="323" class="swflow-title">SWML</text>
    <text x="686" y="347" class="swflow-sub">Server SDKs · Agents</text>
    <line x1="556" y1="376" x2="816" y2="376" class="swflow-divider"/>
    <text x="686" y="415" class="swflow-title">REST API</text>
    <text x="686" y="439" class="swflow-sub">Server SDKs · REST</text>

    <path d="M194 96 V168" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <path d="M194 244 V280" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <path d="M194 356 V392" class="swflow-action" marker-end="url(#swflow-arrow)"/>

    <text x="440" y="308" class="swflow-label">fetches SWML</text>
    <path d="M344 320 H532" class="swflow-action" marker-end="url(#swflow-arrow)"/>

    <text x="698" y="270" class="swflow-label swflow-start">SWAIG tool calls</text>
    <path d="M686 284 V248" class="swflow-action" marker-end="url(#swflow-arrow)"/>

    <text x="440" y="420" class="swflow-label">call commands</text>
    <path d="M536 432 H348" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <text x="440" y="456" class="swflow-label">over HTTP</text>

    <text x="612" y="494" class="swflow-label swflow-start">numbers · Resources · tokens</text>
    <path d="M600 468 V536 Q600 544 592 544 H348" class="swflow-action" marker-end="url(#swflow-arrow)"/>
  </g>
</svg>
