<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 594" width="1000" height="594" role="img" aria-label="A traditional support flow: the customer is transferred from general support to technical support to billing, waiting in a new queue and repeating information each time.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <line x1="170" y1="110" x2="170" y2="608" class="sw-tie"/>
  <rect x="122" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="170" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="390" y1="110" x2="390" y2="320" class="sw-tie"/>
  <line x1="390" y1="359" x2="390" y2="365" class="sw-tie"/>
  <line x1="390" y1="389" x2="390" y2="405" class="sw-tie"/>
  <line x1="390" y1="429" x2="390" y2="445" class="sw-tie"/>
  <line x1="390" y1="469" x2="390" y2="485" class="sw-tie"/>
  <line x1="390" y1="509" x2="390" y2="608" class="sw-tie"/>
  <rect x="342" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="390" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">General</text>
  <line x1="610" y1="110" x2="610" y2="320" class="sw-tie"/>
  <line x1="610" y1="359" x2="610" y2="525" class="sw-tie"/>
  <line x1="610" y1="564" x2="610" y2="608" class="sw-tie"/>
  <rect x="559" y="78" width="102" height="32" rx="16" class="sw-chip-fill"/>
  <text x="610" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Technical</text>
  <line x1="830" y1="110" x2="830" y2="525" class="sw-tie"/>
  <line x1="830" y1="564" x2="830" y2="608" class="sw-tie"/>
  <rect x="782" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="830" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Billing</text>
  <text x="280" y="143" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I need account help&quot;</text>
  <line x1="170" y1="156" x2="382" y2="156" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="160" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <text x="280" y="183" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I can assist with basic</text>
  <text x="280" y="199" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">account questions&quot;</text>
  <line x1="390" y1="212" x2="178" y2="212" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="216" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <text x="280" y="239" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I&#x27;m seeing API errors&quot;</text>
  <line x1="170" y1="252" x2="382" y2="252" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="256" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <text x="280" y="279" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;Let me transfer you to</text>
  <text x="280" y="295" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">technical support&quot;</text>
  <line x1="390" y1="308" x2="178" y2="308" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="312" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">4</text>
  <rect x="269" y="324" width="462" height="31" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="269" y="324" width="462" height="31" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="269" y1="334" x2="269" y2="345" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="500" y="344" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">Customer waits in a new queue</text>
  <text x="390" y="380" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I&#x27;m having API issues&quot;</text>
  <line x1="170" y1="393" x2="602" y2="393" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="397" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">5</text>
  <text x="390" y="420" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;I can help with technical problems&quot;</text>
  <line x1="610" y1="433" x2="178" y2="433" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="437" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">6</text>
  <text x="390" y="460" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;What about my invoice?&quot;</text>
  <line x1="170" y1="473" x2="602" y2="473" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="477" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">7</text>
  <text x="390" y="500" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;Let me transfer you to billing&quot;</text>
  <line x1="610" y1="513" x2="178" y2="513" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="517" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">8</text>
  <rect x="489" y="529" width="462" height="31" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="489" y="529" width="462" height="31" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="489" y1="539" x2="489" y2="550" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="549" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">Customer waits again</text>
  <text x="500" y="585" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;About my invoice...&quot;</text>
  <line x1="170" y1="598" x2="822" y2="598" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="602" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">9</text>
  </g>
  </g>
</svg>
