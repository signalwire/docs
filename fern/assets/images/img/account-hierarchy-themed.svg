<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" width="1000" height="492" role="img" aria-label="One SignalWire account owns two Spaces, example.signalwire.com and example-dev.signalwire.com. The first Space holds two Projects, one of which holds a Subproject; the second Space holds one Project. Each Space can hold many Projects, and each Project can hold subprojects one level deep.">
  <g class="swflow-theme">
    <defs>
      <radialGradient id="swflow-orb-purple" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-opacity="0.10"/>
        <stop offset="1" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="swflow-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-opacity="0.07"/>
        <stop offset="1" stop-opacity="0"/>
      </radialGradient>
      <pattern id="swflow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
      </pattern>
      <clipPath id="swflow-card"><rect x="8" y="8" width="984" height="476" rx="20"/></clipPath>
      <filter id="swflow-shadow" x="-15%" y="-15%" width="130%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#070c2d" flood-opacity="0.10"/>
      </filter>
      <style>
        /* Static hierarchy, not a live process: containment shows Space-holds-
           Projects (Project cards sit inside their Space panel), the two solid
           links carry Account-owns-Spaces, and one nested link carries
           Project-holds-Subproject. No dash animation on purpose, and no
           kicker label — the page heading does that job.

           Chip glyphs are drawn from primitives (person, globe, folder) at the
           house size — 24 in a 40 chip, 22 in 36 — since no Font Awesome
           source for these three exists in the repo yet. */
        .swflow-theme {
          --sw-fuchsia: #F72A72;
          --sw-purple: #601BE6;
          --swflow-ink: #070c2d;
          --swflow-chip: #044EF4;
          --swflow-on-chip: #ffffff;
          --swflow-node-fill: 0.065;
          --swflow-node-line: 0.14;
          --swflow-panel-fill: 0.03;
          --swflow-panel-line: 0.10;
          color: var(--swflow-ink);
        }
        @media (prefers-color-scheme: dark) {
          .swflow-theme {
            --swflow-ink: #f0f0f4;
            --swflow-chip: #40E0D0;
            --swflow-on-chip: #0e0e18;
            --swflow-node-fill: 0.065;
            --swflow-node-line: 0.16;
            --swflow-panel-fill: 0.04;
            --swflow-panel-line: 0.12;
          }
        }
        #swflow-orb-purple stop { stop-color: var(--sw-purple); }
        #swflow-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
        .swflow-chip { fill: var(--swflow-chip); }
        .swflow-on-chip { fill: var(--swflow-on-chip); }
        .swflow-glyph-ink { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.4; }

        .swflow-panel {
          fill: currentColor; fill-opacity: var(--swflow-panel-fill);
          stroke: currentColor; stroke-opacity: var(--swflow-panel-line); stroke-width: 1.5;
        }
        .swflow-node {
          fill: currentColor; fill-opacity: var(--swflow-node-fill);
          stroke: currentColor; stroke-opacity: var(--swflow-node-line); stroke-width: 1.5;
        }
        .swflow-link { fill: none; stroke: var(--sw-fuchsia); stroke-width: 2; stroke-linecap: round; }

        .swflow-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
        .swflow-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
        .swflow-panelhead { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: currentColor; fill-opacity: 0.6; }
        .swflow-panelsub { font-size: 12px; fill: currentColor; fill-opacity: 0.55; }
        .swflow-title { font-size: 17px; font-weight: 600; fill: currentColor; }
        .swflow-sub { font-size: 12px; fill: currentColor; fill-opacity: 0.62; }
      </style>
    </defs>

    <rect x="8" y="8" width="984" height="476" rx="20" fill="currentColor" fill-opacity="0.03"/>
    <g clip-path="url(#swflow-card)">
      <circle cx="900" cy="0" r="270" fill="url(#swflow-orb-purple)"/>
      <circle cx="60" cy="492" r="240" fill="url(#swflow-orb-fuchsia)"/>
      <rect x="8" y="8" width="984" height="476" fill="url(#swflow-dots)"/>
    </g>
    <rect x="8" y="8" width="984" height="476" rx="20" fill="none" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5"/>

    <rect x="352" y="40" width="296" height="96" rx="12" class="swflow-node" filter="url(#swflow-shadow)"/>
    <rect x="372" y="62" width="40" height="40" rx="10" class="swflow-chip"/>
    <g transform="translate(380 70)">
      <circle cx="12" cy="8" r="4.5" class="swflow-on-chip"/>
      <path d="M12 15c-5 0-8 3-8 6h16c0-3-3-6-8-6" class="swflow-on-chip"/>
    </g>
    <text x="424" y="78" class="swflow-hd swflow-title">Account</text>
    <text x="424" y="99" class="swflow-hd swflow-sub">Owns one or more Spaces</text>

    <path d="M460 136 V 158 Q460 166 452 166 H 274 Q266 166 266 174 V 200" class="swflow-link"/>
    <path d="M540 136 V 158 Q540 166 548 166 H 726 Q734 166 734 174 V 200" class="swflow-link"/>

    <rect x="40" y="200" width="452" height="272" rx="16" class="swflow-panel"/>
    <text x="60" y="230" class="swflow-mono swflow-panelhead">SPACE</text>
    <g transform="translate(60 240)">
      <circle cx="8" cy="8" r="7" class="swflow-glyph-ink"/>
      <ellipse cx="8" cy="8" rx="3.2" ry="7" class="swflow-glyph-ink"/>
      <line x1="1" y1="8" x2="15" y2="8" class="swflow-glyph-ink"/>
    </g>
    <text x="84" y="253" class="swflow-mono swflow-panelsub">example.signalwire.com</text>

    <rect x="56" y="280" width="200" height="64" rx="12" class="swflow-node" filter="url(#swflow-shadow)"/>
    <rect x="70" y="294" width="36" height="36" rx="9" class="swflow-chip"/>
    <g transform="translate(77 301)">
      <path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" class="swflow-on-chip"/>
    </g>
    <text x="118" y="318" class="swflow-hd swflow-title">Project</text>

    <path d="M72 344 V 400 Q72 408 80 408 H 88" class="swflow-link"/>
    <rect x="88" y="376" width="184" height="64" rx="12" class="swflow-node" filter="url(#swflow-shadow)"/>
    <rect x="102" y="390" width="36" height="36" rx="9" class="swflow-chip"/>
    <g transform="translate(109 397)">
      <path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" class="swflow-on-chip" fill-opacity="0.55"/>
      <path d="M6 9h12v7a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9z" class="swflow-on-chip"/>
    </g>
    <text x="150" y="414" class="swflow-hd swflow-title">Subproject</text>

    <rect x="272" y="280" width="200" height="64" rx="12" class="swflow-node" filter="url(#swflow-shadow)"/>
    <rect x="286" y="294" width="36" height="36" rx="9" class="swflow-chip"/>
    <g transform="translate(293 301)">
      <path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" class="swflow-on-chip"/>
    </g>
    <text x="334" y="318" class="swflow-hd swflow-title">Project</text>

    <rect x="508" y="200" width="452" height="272" rx="16" class="swflow-panel"/>
    <text x="528" y="230" class="swflow-mono swflow-panelhead">SPACE</text>
    <g transform="translate(528 240)">
      <circle cx="8" cy="8" r="7" class="swflow-glyph-ink"/>
      <ellipse cx="8" cy="8" rx="3.2" ry="7" class="swflow-glyph-ink"/>
      <line x1="1" y1="8" x2="15" y2="8" class="swflow-glyph-ink"/>
    </g>
    <text x="552" y="253" class="swflow-mono swflow-panelsub">example-dev.signalwire.com</text>

    <rect x="524" y="280" width="200" height="64" rx="12" class="swflow-node" filter="url(#swflow-shadow)"/>
    <rect x="538" y="294" width="36" height="36" rx="9" class="swflow-chip"/>
    <g transform="translate(545 301)">
      <path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" class="swflow-on-chip"/>
    </g>
    <text x="586" y="318" class="swflow-hd swflow-title">Project</text>

  </g>
</svg>
