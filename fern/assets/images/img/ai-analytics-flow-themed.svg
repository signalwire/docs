<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-label="While the agent answers a customer question, it sends interaction data to your webhook, which receives speech confidence, response time, and language in real time.">
  <g class="sw-theme">
  <defs>
    <radialGradient id="sw-orb-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.10"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sw-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sw-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
    </pattern>
    <clipPath id="sw-card">
      <rect x="8" y="8" width="984" height="574" rx="20"/>
    </clipPath>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>

  <rect x="8" y="8" width="984" height="574" rx="20" fill="currentColor" fill-opacity="0.035"/>
  <g clip-path="url(#sw-card)">
    <circle cx="880" cy="8" r="300" fill="url(#sw-orb-purple)"/>
    <circle cx="90" cy="590" r="280" fill="url(#sw-orb-fuchsia)"/>
    <rect x="8" y="8" width="984" height="574" fill="url(#sw-dots)"/>
  </g>
  <rect x="8" y="8" width="984" height="574" rx="20" fill="none" stroke="currentColor" stroke-opacity="0.13" stroke-width="1.5"/>
  <line x1="40" y1="47" x2="64" y2="47" class="sw-accent-stroke" stroke-width="2"/>
  <text x="72" y="52" class="sw-mono sw-accent" font-size="12" font-weight="700" letter-spacing="1.7">REAL-TIME ANALYTICS</text>
  <line x1="207" y1="126" x2="207" y2="550" class="sw-tie"/>
  <rect x="159" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="207" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="500" y1="126" x2="500" y2="550" class="sw-tie"/>
  <rect x="452" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="500" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">AI agent</text>
  <line x1="793" y1="126" x2="793" y2="550" class="sw-tie"/>
  <rect x="745" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="793" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Webhook</text>
  <text x="353" y="172" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Asks about a product return</text>
  <line x1="207" y1="190" x2="491" y2="190" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="194" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <rect x="377" y="216" width="246" height="35" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="377" y="216" width="246" height="35" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="377" y1="226" x2="377" y2="241" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="500" y="231" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Processes the request</text>
  <text x="647" y="287" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Sends interaction data</text>
  <line x1="500" y1="305" x2="784" y2="305" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="309" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <rect x="670" y="331" width="246" height="35" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="670" y="331" width="246" height="35" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="670" y1="341" x2="670" y2="356" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="793" y="346" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Analytics processing</text>
  <text x="353" y="402" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Responds to the customer</text>
  <line x1="500" y1="420" x2="216" y2="420" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="424" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <rect x="670" y="446" width="246" height="86" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="670" y="446" width="246" height="86" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="670" y1="456" x2="670" y2="522" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="793" y="461" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Real-time updates: speech</text>
  <text x="793" y="478" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">confidence 0.876,</text>
  <text x="793" y="495" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">response time 850ms, language</text>
  <text x="793" y="512" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">en-US</text>
  </g>
</svg>
