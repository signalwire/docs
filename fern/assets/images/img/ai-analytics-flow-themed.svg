<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 495" width="1000" height="495" role="img" aria-label="While the agent answers a customer question, it sends interaction data to your webhook, which receives speech confidence, response time, and language in real time.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <line x1="207" y1="126" x2="207" y2="509" class="sw-tie"/>
  <rect x="159" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="207" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="500" y1="126" x2="500" y2="509" class="sw-tie"/>
  <rect x="452" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="500" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">AI agent</text>
  <line x1="793" y1="126" x2="793" y2="509" class="sw-tie"/>
  <rect x="745" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="793" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Webhook</text>
  <text x="353" y="172" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Asks about a product return</text>
  <line x1="207" y1="190" x2="492" y2="190" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="194" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <rect x="339" y="212" width="323" height="35" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="339" y="212" width="323" height="35" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="339" y1="222" x2="339" y2="237" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="500" y="227" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Processes the request</text>
  <text x="647" y="279" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Sends interaction data</text>
  <line x1="500" y1="297" x2="785" y2="297" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="301" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <rect x="632" y="319" width="323" height="35" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="632" y="319" width="323" height="35" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="632" y1="329" x2="632" y2="344" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="793" y="334" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Analytics processing</text>
  <text x="353" y="386" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Responds to the customer</text>
  <line x1="500" y1="404" x2="215" y2="404" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="408" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <rect x="632" y="426" width="323" height="69" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="632" y="426" width="323" height="69" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="632" y1="436" x2="632" y2="485" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="793" y="441" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Real-time updates: speech confidence</text>
  <text x="793" y="458" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">0.876,</text>
  <text x="793" y="475" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">response time 850ms, language en-US</text>
  </g>
  </g>
</svg>
