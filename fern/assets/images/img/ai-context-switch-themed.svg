<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 728" width="1000" height="728" role="img" aria-label="One AI agent switching context within a single call: support, then technical support, then billing, each with its own prompt and fresh conversation memory.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <line x1="280" y1="126" x2="280" y2="718" class="sw-tie"/>
  <rect x="232" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="280" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="720" y1="126" x2="720" y2="718" class="sw-tie"/>
  <rect x="672" y="92" width="96" height="34" rx="17" class="sw-chip-fill"/>
  <text x="720" y="114" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">AI agent</text>
  <rect x="535" y="160" width="370" height="52" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="535" y="160" width="370" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="535" y1="170" x2="535" y2="202" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="175" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Support context</text>
  <text x="720" y="192" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Prompt: general inquiry instructions</text>
  <text x="500" y="248" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;I need help with my account&quot;</text>
  <line x1="280" y1="266" x2="711" y2="266" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="270" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <text x="500" y="304" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;I can help with account-related questions&quot;</text>
  <line x1="720" y1="322" x2="289" y2="322" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="326" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <text x="500" y="360" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;I&#x27;m getting API errors&quot;</text>
  <line x1="280" y1="378" x2="711" y2="378" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="382" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <rect x="535" y="404" width="370" height="52" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="535" y="404" width="370" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="535" y1="414" x2="535" y2="446" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="419" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">New context</text>
  <text x="720" y="436" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Prompt: technical support instructions</text>
  <text x="500" y="492" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;Let me check your API logs...&quot;</text>
  <line x1="720" y1="510" x2="289" y2="510" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="514" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">4</text>
  <text x="500" y="548" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;What about my invoice?&quot;</text>
  <line x1="280" y1="566" x2="711" y2="566" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="570" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">5</text>
  <rect x="535" y="592" width="370" height="52" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="535" y="592" width="370" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="535" y1="602" x2="535" y2="634" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="720" y="607" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">New context</text>
  <text x="720" y="624" text-anchor="middle" class="sw-mono" font-size="13" fill="currentColor" fill-opacity="0.66">Prompt: billing support instructions</text>
  <text x="500" y="680" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">&quot;I see your billing history...&quot;</text>
  <line x1="720" y1="698" x2="289" y2="698" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="702" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">6</text>
  <text x="500.0" y="756" text-anchor="middle" class="sw-mono" font-size="11.5" letter-spacing="1.1" fill="currentColor" fill-opacity="0.5">each topic gets a specialized agent · no queue, no retelling</text>
  </g>
  </g>
</svg>
