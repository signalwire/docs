  <text x="104" y="224" class="swredact-mono" font-size="13" fill="currentColor" fill-opacity="0.78">My card number is</text>
  <text x="104" y="246" class="swredact-mono" font-size="13" fill="currentColor" fill-opacity="0.78">4242 4242 4242 4242</text>

  <line x1="332" y1="202" x2="360" y2="202" class="swredact-dash" marker-end="url(#swredact-arrow-f)"/>

  <rect x="370" y="124" width="260" height="156" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="370" y="124" width="260" height="156" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.14" stroke-width="1.5"/>
