<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="What redaction changes: the caller speaks a real card number, the AI agent receives the real value and replies normally, the caller hears the reply in full, and every record of the call carries the number masked as four dashes.">
  <g class="swredact-theme">
  <defs>
    <radialGradient id="swredact-orb-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.10"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="swredact-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="swredact-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
    </pattern>
    <clipPath id="swredact-card">
      <rect x="8" y="8" width="984" height="544" rx="20"/>
    </clipPath>
    <!-- refX=1 anchors the arrow BASE at the path end so animated dashes stop
         under the head instead of poking past the tip; every marked path is
         drawn ~10px short (the arrow's rendered length) to compensate. -->
    <marker id="swredact-arrow-f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" class="swredact-accent"/>
    </marker>
    <style>
      /* THEMED variant — one file serving both modes, embedded as a single
         plain img tag with no .light-only / .dark-only pair.

         How it follows the site theme: the docs set `color-scheme` on the html
         element (light or dark, per Fern's theme toggle), that inherits down to
         the img element, and the browser propagates the embedding element's
         color-scheme into the SVG image's own document — so the media query
         below tracks the site toggle rather than the visitor's OS setting.
         Where a browser hasn't implemented that propagation, the query falls
         back to the OS preference, which is what the toggle defaults to anyway.

         The colors are literal brand hexes rather than Fern's --accent /
         --grayscale-* variables: custom properties do not cross document
         boundaries, so nothing from the page reaches an img-embedded SVG. Both
         modes live in this one file instead, which is the point.

         var() is invalid in SVG presentation attributes, so colored
         fills/strokes go through the classes below; the mode-dependent values
         are the four custom properties on .swredact-theme. */
      .swredact-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --swredact-ink: #070c2d;
        --swredact-chip: #044EF4;      /* SW Blue, matching accent-primary light */
        --swredact-on-chip: #ffffff;
        --swredact-caller-icon: var(--swredact-ink);
        color: var(--swredact-ink);
      }
      @media (prefers-color-scheme: dark) {
        .swredact-theme {
          --swredact-ink: #f0f0f4;
          --swredact-chip: #40E0D0;    /* SW Turquoise, matching accent-primary dark */
          --swredact-on-chip: #0e0e18;
          /* The dark diagram tints the caller glyph with the accent instead of leaving it neutral. */
          --swredact-caller-icon: #40E0D0;
        }
      }
      .swredact-accent { fill: var(--sw-fuchsia); }
      .swredact-accent-stroke { stroke: var(--sw-fuchsia); }
      .swredact-chip { fill: var(--swredact-chip); }
      .swredact-glyph { fill: var(--swredact-on-chip); }
      .swredact-caller-glyph { fill: var(--swredact-caller-icon); }
      #swredact-orb-purple stop { stop-color: var(--sw-purple); }
      #swredact-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .swredact-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .swredact-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .swredact-dash { stroke: var(--sw-fuchsia); stroke-width: 2; stroke-dasharray: 7 7; animation: swredact-dashmove 1.4s linear infinite; }
      @keyframes swredact-dashmove { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { .swredact-dash { animation: none; } }
    </style>
  </defs>

  <rect x="8" y="8" width="984" height="544" rx="20" fill="currentColor" fill-opacity="0.035"/>
