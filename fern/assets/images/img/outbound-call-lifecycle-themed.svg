<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 636" width="600" height="636" role="img" aria-labelledby="outbound-title outbound-desc">
  <title id="outbound-title">Outbound call with the Calling API or Server SDK REST client</title>
  <desc id="outbound-desc">Your code sends dial with from, to, and SWML. SignalWire returns a call id with status queued and rings the rider's phone. The rider answers, SignalWire sends an answered webhook, and your SWML runs. When the call finishes, SignalWire sends an ended webhook.</desc>
  <g class="swflow-theme">
  <defs>
    <style>
      .swflow-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --swflow-ink: #070c2d;
        --swflow-chip: #044EF4;
        --swflow-on-chip: #ffffff;
        color: var(--swflow-ink);
        font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
        font-size: 24px;
      }
      @media (prefers-color-scheme: dark) {
        .swflow-theme {
          --swflow-ink: #f0f0f4;
          --swflow-chip: #40E0D0;
          --swflow-on-chip: #0e0e18;
        }
      }
      .swflow-chip { fill: var(--swflow-chip); }
      .swflow-on-chip { fill: var(--swflow-on-chip); }
      .swflow-accent { fill: var(--sw-fuchsia); }
      .swflow-panel { fill: currentColor; fill-opacity: 0.03; stroke: currentColor; stroke-opacity: 0.12; }
      .swflow-node { fill: currentColor; fill-opacity: 0.065; stroke: currentColor; stroke-opacity: 0.16; }
      .swflow-note { fill: var(--sw-purple); fill-opacity: 0.08; stroke: var(--sw-purple); stroke-opacity: 0.45; }
      .swflow-lifeline { stroke: currentColor; stroke-opacity: 0.22; stroke-width: 1.5; stroke-dasharray: 2 6; }
      .swflow-action, .swflow-return { fill: none; stroke: var(--sw-fuchsia); stroke-width: 2; }
      .swflow-return { stroke-dasharray: 6 6; }
      text { fill: currentColor; text-anchor: middle; }
      .swflow-title { font-size: 22px; font-weight: 600; }
      .swflow-label { font-weight: 600; }
      .swflow-detail { font-size: 22px; }
    </style>
    <marker id="swflow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 8 5 0 9z" class="swflow-accent"/>
    </marker>
  </defs>
    <rect x="4" y="4" width="592" height="628" rx="18" class="swflow-panel"/>
    <line x1="90" y1="114" x2="90" y2="618" class="swflow-lifeline"/>
    <rect x="12" y="22" width="156" height="92" rx="12" class="swflow-node"/>
    <rect x="68" y="32" width="44" height="40" rx="10" class="swflow-chip"/>
