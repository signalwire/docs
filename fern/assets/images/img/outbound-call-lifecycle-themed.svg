<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Sequence of an outbound call. Your code sends dial with from, to, and what to run. SignalWire returns the call id with status queued, rings the rider's phone, and sends a ringing status webhook. The rider answers and SignalWire sends an answered webhook, then your SWML runs or your Relay code drives the call. When the rider hangs up, SignalWire sends an ended webhook.">
  <g class="swflow-theme">
    <defs>
      <radialGradient id="swflow-orb-purple" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-opacity="0.10"/>
        <stop offset="1" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="swflow-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-opacity="0.07"/>
        <stop offset="1" stop-opacity="0"/>
      </radialGradient>
      <pattern id="swflow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
      </pattern>
      <clipPath id="swflow-card"><rect x="8" y="8" width="984" height="544" rx="20"/></clipPath>
      <filter id="swflow-shadow" x="-15%" y="-15%" width="130%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#070c2d" flood-opacity="0.10"/>
      </filter>
      <!-- refX=1 anchors the arrow base at the path end, so every marked path
           is drawn ~5px short of the lifeline it points at. -->
      <marker id="swflow-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 1 8 5 0 9z" class="swflow-accent"/>
      </marker>
      <style>
        /* Same theme block as ai-agent-flow-themed.svg. Solid fuchsia arrows
           are actions on the call; dashed ones are what comes back to your
           code (the dial response and status webhooks). Step chips use the
           chip color so the numbers read in both modes. */
        .swflow-theme {
          --sw-fuchsia: #F72A72;
          --sw-purple: #601BE6;
          --swflow-ink: #070c2d;
          --swflow-chip: #044EF4;
          --swflow-on-chip: #ffffff;
          --swflow-node-fill: 0.065;
          --swflow-node-line: 0.14;
          --swflow-panel-fill: 0.03;
          --swflow-panel-line: 0.10;
          color: var(--swflow-ink);
        }
        @media (prefers-color-scheme: dark) {
          .swflow-theme {
            --swflow-ink: #f0f0f4;
            --swflow-chip: #40E0D0;
            --swflow-on-chip: #0e0e18;
            --swflow-node-fill: 0.065;
            --swflow-node-line: 0.16;
            --swflow-panel-fill: 0.04;
            --swflow-panel-line: 0.12;
          }
        }
        #swflow-orb-purple stop { stop-color: var(--sw-purple); }
        #swflow-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
        .swflow-accent { fill: var(--sw-fuchsia); }
        .swflow-chip { fill: var(--swflow-chip); }
        .swflow-on-chip { fill: var(--swflow-on-chip); }

        .swflow-node {
          fill: currentColor; fill-opacity: var(--swflow-node-fill);
          stroke: currentColor; stroke-opacity: var(--swflow-node-line); stroke-width: 1.5;
        }
        .swflow-note {
          fill: var(--sw-purple); fill-opacity: 0.08;
          stroke: var(--sw-purple); stroke-opacity: 0.45; stroke-width: 1.5;
        }
        .swflow-lifeline { stroke: currentColor; stroke-opacity: 0.22; stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; }
        .swflow-action { fill: none; stroke: var(--sw-fuchsia); stroke-width: 2; stroke-linecap: round; }
        .swflow-return { fill: none; stroke: var(--sw-fuchsia); stroke-width: 2; stroke-dasharray: 6 7; stroke-linecap: round; }

        .swflow-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
        .swflow-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
        .swflow-kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.7px; fill: var(--sw-fuchsia); }
        .swflow-title { font-size: 17px; font-weight: 600; fill: currentColor; }
        .swflow-sub { font-size: 12px; fill: currentColor; fill-opacity: 0.62; }
        .swflow-label { font-size: 13px; font-weight: 600; fill: currentColor; fill-opacity: 0.9; }
        .swflow-meta { font-size: 11.5px; letter-spacing: 0.3px; fill: currentColor; fill-opacity: 0.6; }
        .swflow-step { font-size: 11px; font-weight: 700; }
      </style>
    </defs>

    <rect x="8" y="8" width="984" height="544" rx="20" fill="currentColor" fill-opacity="0.03"/>
    <g clip-path="url(#swflow-card)">
      <circle cx="900" cy="0" r="270" fill="url(#swflow-orb-purple)"/>
      <circle cx="60" cy="560" r="240" fill="url(#swflow-orb-fuchsia)"/>
      <rect x="8" y="8" width="984" height="544" fill="url(#swflow-dots)"/>
    </g>
    <rect x="8" y="8" width="984" height="544" rx="20" fill="none" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5"/>

    <line x1="40" y1="44" x2="64" y2="44" stroke="#F72A72" stroke-width="2"/>
    <text x="72" y="49" class="swflow-mono swflow-kicker">OUTBOUND CALL LIFECYCLE</text>
    <text x="960" y="49" text-anchor="end" class="swflow-hd swflow-meta">Solid: actions on the call · Dashed: what your code receives</text>

    <!-- Lifelines -->
    <line x1="170" y1="140" x2="170" y2="520" class="swflow-lifeline"/>
    <line x1="500" y1="140" x2="500" y2="520" class="swflow-lifeline"/>
    <line x1="830" y1="140" x2="830" y2="520" class="swflow-lifeline"/>

    <!-- Participants -->
    <rect x="60" y="76" width="220" height="64" rx="12" class="swflow-node" filter="url(#swflow-shadow)"/>
    <rect x="76" y="88" width="40" height="40" rx="10" class="swflow-chip"/>
    <svg x="84" y="96" width="24" height="24" viewBox="0 0 576 512"><path class="swflow-on-chip" d="M205.1 225.5L138.7 344.4c-19.6 2.6-34.7 19.4-34.7 39.6 0 22.1 17.9 40 40 40s40-17.9 40-40c0-5.8-1.2-11.3-3.4-16.2l76.9-137.6c6.4-11.5 2.4-26.1-9.1-32.6-30.4-17.3-46.9-53.3-38-88.9 10.7-42.9 54.1-69 97-58.3 35.6 8.9 59.7 40.3 60.6 75.3 .4 13.2 11.4 23.7 24.7 23.3s23.7-11.4 23.3-24.7c-1.6-56-40-106.3-97-120.5-68.6-17.1-138.1 24.7-155.2 93.3-12.2 48.8 5.5 98 41.3 128.5zm119.5-81.4c2.2-4.9 3.4-10.4 3.4-16.1 0-22.1-17.9-40-40-40s-40 17.9-40 40c0 20.3 15.2 37.1 34.8 39.7l77.3 137.4c3.1 5.5 8.3 9.6 14.5 11.3s12.7 .9 18.2-2.2c30.5-17.2 69.9-12.7 95.8 13.2 31.2 31.2 31.2 81.9 0 113.1-25.9 25.9-65.3 30.4-95.8 13.2-11.5-6.5-26.2-2.4-32.7 9.1s-2.4 26.2 9.1 32.7c48.8 27.5 111.7 20.5 153.3-21.1 50-50 50-131 0-181-35.5-35.5-86.7-45.8-131.2-30.9L324.6 144.1zM432 424c22.1 0 40-17.9 40-40s-17.9-40-40-40c-13.1 0-24.7 6.3-32 16l-152 0c-6.4 0-12.5 2.5-17 7s-7 10.6-7 17c0 34.8-22.9 66.8-58 76.9-42.5 12.2-86.8-12.4-99-54.9-10.1-35.3 5.1-71.8 34.9-90.2 11.3-6.9 14.8-21.7 7.9-33s-21.7-14.8-33-7.9c-47.7 29.3-72.1 87.8-55.9 144.3 19.5 68 90.4 107.2 158.3 87.8 48-13.8 81.7-53.2 90.5-99L400 408c7.3 9.7 18.9 16 32 16z"/></svg>
    <text x="128" y="105" class="swflow-hd swflow-title">Your code</text>
    <text x="128" y="124" class="swflow-hd swflow-sub">API request, SDK, or browser</text>

    <rect x="390" y="76" width="220" height="64" rx="12" class="swflow-node" filter="url(#swflow-shadow)"/>
    <rect x="406" y="88" width="40" height="40" rx="10" class="swflow-chip"/>
    <svg x="414" y="96" width="24" height="24" viewBox="0 0 576 512"><path class="swflow-on-chip" d="M248 0c13.3 0 24 10.7 24 24l0 464c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-464c0-13.3 10.7-24 24-24zM440 64c13.3 0 24 10.7 24 24l0 336c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-336c0-13.3 10.7-24 24-24zM152 96c13.3 0 24 10.7 24 24l0 272c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-272c0-13.3 10.7-24 24-24zm192 32c13.3 0 24 10.7 24 24l0 208c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-208c0-13.3 10.7-24 24-24zM56 192c13.3 0 24 10.7 24 24l0 80c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-80c0-13.3 10.7-24 24-24zm480 0c13.3 0 24 10.7 24 24l0 80c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-80c0-13.3 10.7-24 24-24z"/></svg>
    <text x="458" y="105" class="swflow-hd swflow-title">SignalWire</text>
    <text x="458" y="124" class="swflow-hd swflow-sub">Places and controls the call</text>

    <rect x="720" y="76" width="220" height="64" rx="12" class="swflow-node" filter="url(#swflow-shadow)"/>
    <rect x="736" y="88" width="40" height="40" rx="10" class="swflow-chip"/>
    <svg x="744" y="96" width="24" height="24" viewBox="0 0 512 512"><path class="swflow-on-chip" d="M112.8 10.9c27.3-9.1 57 3.9 68.9 30l39.7 87.3c10.6 23.4 4 51-16 67.1l-24.2 19.3c25.5 50 65.5 91.4 114.4 118.8l21.2-26.6c16.1-20.1 43.7-26.7 67.1-16l87.3 39.7c26.2 11.9 39.1 41.6 30 68.9-20.7 62.3-83.7 116.2-160.9 102.6-173.7-30.6-299.6-156.5-330.2-330.2-13.6-77.2 40.4-140.1 102.6-160.9zm25.2 49.9c-1.7-3.8-6-5.7-10-4.4-45.2 15.1-79.1 58.6-70.5 107 27.1 153.8 137.4 264.2 291.2 291.3 48.4 8.5 91.9-25.3 107-70.5 1.3-4-.6-8.3-4.4-10L364 334.4c-3.4-1.5-7.4-.6-9.7 2.3l-33.5 41.9c-7 8.7-19 11.5-29 6.7-72.5-34.4-130.5-94.3-162.4-168.2-4.3-9.9-1.4-21.5 7-28.2l38.9-31.1c2.9-2.3 3.9-6.3 2.3-9.7L137.9 60.7z"/></svg>
    <text x="788" y="105" class="swflow-hd swflow-title">Rider's phone</text>
    <text x="788" y="124" class="swflow-hd swflow-sub">The number in to</text>

    <!-- 1. dial -->
    <text x="335" y="176" text-anchor="middle" class="swflow-hd swflow-label">dial: from, to, and what to run</text>
    <path d="M186 186 H 490" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <circle cx="170" cy="186" r="11" class="swflow-chip"/>
    <text x="170" y="190" text-anchor="middle" class="swflow-mono swflow-step swflow-on-chip">1</text>

    <!-- 2. response -->
    <text x="335" y="220" text-anchor="middle" class="swflow-mono swflow-meta">call id · status: queued</text>
    <path d="M484 230 H 180" class="swflow-return" marker-end="url(#swflow-arrow)"/>
    <circle cx="500" cy="230" r="11" class="swflow-chip"/>
    <text x="500" y="234" text-anchor="middle" class="swflow-mono swflow-step swflow-on-chip">2</text>

    <!-- 3. rings -->
    <text x="665" y="266" text-anchor="middle" class="swflow-hd swflow-label">rings</text>
    <path d="M516 276 H 820" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <circle cx="500" cy="276" r="11" class="swflow-chip"/>
    <text x="500" y="280" text-anchor="middle" class="swflow-mono swflow-step swflow-on-chip">3</text>

    <!-- 4. ringing webhook -->
    <text x="335" y="266" text-anchor="middle" class="swflow-mono swflow-meta">status webhook: ringing</text>
    <path d="M484 276 H 180" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <!-- 5. answers -->
    <text x="665" y="318" text-anchor="middle" class="swflow-hd swflow-label">answers</text>
    <path d="M814 328 H 510" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <circle cx="830" cy="328" r="11" class="swflow-chip"/>
    <text x="830" y="332" text-anchor="middle" class="swflow-mono swflow-step swflow-on-chip">4</text>

    <!-- 6. answered webhook -->
    <text x="335" y="318" text-anchor="middle" class="swflow-mono swflow-meta">status webhook: answered</text>
    <path d="M484 328 H 180" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <!-- Note: call logic runs -->
    <rect x="520" y="356" width="290" height="76" rx="12" class="swflow-note"/>
    <text x="665" y="384" text-anchor="middle" class="swflow-hd swflow-label">Your call logic runs</text>
    <text x="665" y="404" text-anchor="middle" class="swflow-hd swflow-sub">The SWML you supplied plays out,</text>
    <text x="665" y="420" text-anchor="middle" class="swflow-hd swflow-sub">or your Relay code drives the live call</text>

    <!-- 7. hangs up -->
    <text x="665" y="464" text-anchor="middle" class="swflow-hd swflow-label">hangs up</text>
    <path d="M814 474 H 510" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <circle cx="830" cy="474" r="11" class="swflow-chip"/>
    <text x="830" y="478" text-anchor="middle" class="swflow-mono swflow-step swflow-on-chip">5</text>

    <!-- 8. ended webhook -->
    <text x="335" y="464" text-anchor="middle" class="swflow-mono swflow-meta">status webhook: ended</text>
    <path d="M484 474 H 180" class="swflow-return" marker-end="url(#swflow-arrow)"/>

  </g>
</svg>
