    <svg x="496" y="38" width="28" height="28" viewBox="0 0 512 512"><path class="swflow-on-chip" d="M112.8 10.9c27.3-9.1 57 3.9 68.9 30l39.7 87.3c10.6 23.4 4 51-16 67.1l-24.2 19.3c25.5 50 65.5 91.4 114.4 118.8l21.2-26.6c16.1-20.1 43.7-26.7 67.1-16l87.3 39.7c26.2 11.9 39.1 41.6 30 68.9-20.7 62.3-83.7 116.2-160.9 102.6-173.7-30.6-299.6-156.5-330.2-330.2-13.6-77.2 40.4-140.1 102.6-160.9zm25.2 49.9c-1.7-3.8-6-5.7-10-4.4-45.2 15.1-79.1 58.6-70.5 107 27.1 153.8 137.4 264.2 291.2 291.3 48.4 8.5 91.9-25.3 107-70.5 1.3-4-.6-8.3-4.4-10L364 334.4c-3.4-1.5-7.4-.6-9.7 2.3l-33.5 41.9c-7 8.7-19 11.5-29 6.7-72.5-34.4-130.5-94.3-162.4-168.2-4.3-9.9-1.4-21.5 7-28.2l38.9-31.1c2.9-2.3 3.9-6.3 2.3-9.7L137.9 60.7z"/></svg>
    <text x="510" y="98" class="swflow-title">Rider’s phone</text>

    <!-- Request and queued response -->
    <text x="195" y="146" class="swflow-label">dial</text>
    <text x="195" y="172" class="swflow-detail">from, to, SWML</text>
    <path d="M90 186 H296" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <text x="195" y="238" class="swflow-detail">call id, queued</text>
    <path d="M300 252 H94" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <!-- Phone activity -->
    <text x="405" y="292" class="swflow-label">rings</text>
    <path d="M300 306 H506" class="swflow-action" marker-end="url(#swflow-arrow)"/>
    <text x="405" y="352" class="swflow-label">answers</text>
    <path d="M510 366 H304" class="swflow-action" marker-end="url(#swflow-arrow)"/>

    <!-- Only the events requested by the guide's REST examples -->
    <text x="195" y="388" class="swflow-label">answered</text>
    <text x="195" y="414" class="swflow-detail">webhook</text>
    <path d="M300 426 H94" class="swflow-return" marker-end="url(#swflow-arrow)"/>

    <rect x="306" y="452" width="264" height="56" rx="12" class="swflow-note"/>
    <text x="438" y="487" class="swflow-label">Your SWML runs</text>
    <text x="405" y="548" class="swflow-detail">Call finishes</text>

    <text x="195" y="566" class="swflow-label">ended</text>
    <text x="195" y="592" class="swflow-detail">webhook</text>
    <path d="M300 606 H94" class="swflow-return" marker-end="url(#swflow-arrow)"/>
  </g>
</svg>
