    <svg x="82" y="340" width="24" height="24" viewBox="0 24 512 520"><path class="swflow-on-chip" d="M203.7 512.9l0 0 91.9-64.9 120.4 0c53 0 96-43 96-96l0-224c0-53-43-96-96-96L96 32C43 32 0 75 0 128L0 352c0 53 43 96 96 96l32 0 0 72c0 9 5 17.2 13 21.3s17.6 3.5 24.9-1.7l37.8-26.7zM295.6 400c-9.9 0-19.6 3.1-27.7 8.8-28.6 20.2-59.3 41.8-91.9 64.9l0-49.7c0-2.8-.5-5.6-1.4-8.1-3.3-9.3-12.2-15.9-22.6-15.9l-56 0c-26.5 0-48-21.5-48-48l0-224c0-26.5 21.5-48 48-48l320 0c26.5 0 48 21.5 48 48l0 224c0 26.5-21.5 48-48 48l-120.4 0zM144 272a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm144-32a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm80 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64z"/></svg>
