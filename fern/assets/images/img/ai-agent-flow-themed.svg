<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 512" width="1000" height="512" role="img" aria-label="One SignalWire AI agent, reached over multiple channels. A channel carries only transport: voice over PSTN, SIP, or WebRTC, and text as one HTTP request per turn through the AI Chat API. Either channel runs both ways, carrying the caller or client to the agent and the agent's reply back. The SignalWire platform handles end-pointing, speech-to-text, text-to-speech, and the call or chat session, and holds the agent's prompt, contexts, and state. The agent's SWAIG tools post each tool call to your backend over HTTP, the only network hop off the platform, where your webhook reads your own systems.">
  <g class="swflow-theme">
    <defs>
      <radialGradient id="swflow-orb-purple" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-opacity="0.10"/>
        <stop offset="1" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="swflow-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-opacity="0.07"/>
        <stop offset="1" stop-opacity="0"/>
      </radialGradient>
      <pattern id="swflow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
      </pattern>
      <clipPath id="swflow-card"><rect x="8" y="8" width="984" height="496" rx="20"/></clipPath>
      <filter id="swflow-shadow" x="-15%" y="-15%" width="130%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#070c2d" flood-opacity="0.10"/>
      </filter>
      <!-- refX=1 anchors the arrow BASE at the path end so animated dashes stop
           under the head instead of poking past the tip; every marked path is
           drawn ~5px short (the arrow's rendered length) to compensate. -->
      <marker id="swflow-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 1 8 5 0 9z" class="swflow-accent"/>
      </marker>
      <style>
        /* Glyphs are Font Awesome regular (far), the same family and style the
           docs nav uses. Product nodes carry their product's own nav icon:
           waveform-lines for Calling, message-dots for Messaging, robot for AI.
           Keep the glyph at 24 inside a 40 chip (22 in 36) — a larger glyph
           crowds the chip and thickens its own strokes.

           Depth comes from two levels of the same ink tint plus a soft shadow:
           panels are the fainter level, node cards the stronger one. Keep the
           card fill a tint — a white card fill blows out the light theme.
           Fuchsia marks the flow: lines, arrowheads, edge labels, kicker.

           All three sections are panels and links run panel to panel, so the
           two channels share one arrow pair instead of routing one each. */
        .swflow-theme {
          --sw-fuchsia: #F72A72;
          --sw-purple: #601BE6;
          --swflow-ink: #070c2d;
          --swflow-chip: #044EF4;
          --swflow-on-chip: #ffffff;
          --swflow-node-fill: 0.065;
          --swflow-node-line: 0.14;
          --swflow-panel-fill: 0.03;
          --swflow-panel-line: 0.10;
          color: var(--swflow-ink);
        }
        @media (prefers-color-scheme: dark) {
          .swflow-theme {
            --swflow-ink: #f0f0f4;
            --swflow-chip: #40E0D0;
            --swflow-on-chip: #0e0e18;
            --swflow-node-fill: 0.065;
            --swflow-node-line: 0.16;
            --swflow-panel-fill: 0.04;
            --swflow-panel-line: 0.12;
          }
        }
        #swflow-orb-purple stop { stop-color: var(--sw-purple); }
        #swflow-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
        .swflow-accent { fill: var(--sw-fuchsia); }
        .swflow-accent-stroke { stroke: var(--sw-fuchsia); }
        .swflow-chip { fill: var(--swflow-chip); }
        .swflow-on-chip { fill: var(--swflow-on-chip); }

        .swflow-panel {
          fill: currentColor; fill-opacity: var(--swflow-panel-fill);
          stroke: currentColor; stroke-opacity: var(--swflow-panel-line); stroke-width: 1.5;
        }
        .swflow-node {
          fill: currentColor; fill-opacity: var(--swflow-node-fill);
          stroke: currentColor; stroke-opacity: var(--swflow-node-line); stroke-width: 1.5;
        }

        .swflow-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
        .swflow-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
        .swflow-kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.7px; fill: var(--sw-fuchsia); }
        .swflow-panelhead { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: currentColor; fill-opacity: 0.6; }
        .swflow-panelsub { font-size: 12px; fill: currentColor; fill-opacity: 0.55; }
        .swflow-title { font-size: 17px; font-weight: 600; fill: currentColor; }
        .swflow-sub { font-size: 12px; fill: currentColor; fill-opacity: 0.62; }
        .swflow-meta { font-size: 11px; letter-spacing: 0.3px; fill: currentColor; fill-opacity: 0.55; }
        .swflow-edge { font-size: 11.5px; letter-spacing: 0.3px; fill: var(--sw-fuchsia); }
        .swflow-edge-tight { font-size: 10.5px; }
        .swflow-band { font-size: 10.5px; letter-spacing: 0.4px; fill: currentColor; fill-opacity: 0.55; }

        .swflow-dash {
          fill: none; stroke: var(--sw-fuchsia); stroke-width: 2;
          stroke-dasharray: 6 8; stroke-linecap: round;
          animation: swflow-dashmove 1.8s linear infinite;
        }
        @keyframes swflow-dashmove { to { stroke-dashoffset: -28; } }
        @media (prefers-reduced-motion: reduce) { .swflow-dash { animation: none; } }
      </style>
    </defs>

