<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 308" width="1000" height="308" role="img" aria-label="On SignalWire, end-pointing, speech-to-text, the language model, and text-to-speech all run inside the engine carrying the call&#x27;s audio, so the only remaining network hop is the tool call to your backend.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <rect x="188" y="84" width="625" height="124" rx="14" fill="currentColor" fill-opacity="0.045"/>
  <rect x="188" y="84" width="625" height="124" rx="14" fill="none" stroke="currentColor" stroke-opacity="0.14" stroke-dasharray="6 5"/>
  <text x="500" y="106" text-anchor="middle" class="sw-mono" font-size="12" letter-spacing="1.2" fill="currentColor" fill-opacity="0.6">SIGNALWIRE</text>
  <rect x="50" y="128" width="132" height="58" rx="29" class="sw-chip-fill"/>
  <text x="116" y="153" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">Caller stops</text>
  <text x="116" y="171" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">speaking</text>
  <line x1="186" y1="157" x2="196" y2="157" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="204" y="128" width="132" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="204" y="128" width="132" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="270" y="162" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">End-pointing</text>
  <line x1="339" y1="157" x2="349" y2="157" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="357" y="128" width="132" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="357" y="128" width="132" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="423" y="162" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Speech-to-text</text>
  <line x1="493" y1="157" x2="503" y2="157" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="511" y="128" width="132" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="511" y="128" width="132" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="577" y="162" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Language model</text>
  <line x1="647" y1="157" x2="657" y2="157" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="665" y="128" width="132" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="665" y="128" width="132" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="730" y="162" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Text-to-speech</text>
  <line x1="800" y1="157" x2="810" y2="157" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="818" y="128" width="132" height="58" rx="29" class="sw-chip-fill"/>
  <text x="884" y="153" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">Caller hears</text>
  <text x="884" y="171" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">the reply</text>
  <line x1="577" y1="208" x2="577" y2="240" class="sw-tie" marker-end="url(#sw-arrow)"/>
  <rect x="487" y="248" width="180" height="44" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="487" y="248" width="180" height="44" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="577" y="275" text-anchor="middle" class="sw-hd" font-size="14" fill="currentColor" fill-opacity="0.88">Your backend</text>
  <text x="677" y="232" class="sw-mono" font-size="11.5" fill="currentColor" fill-opacity="0.55">tool calls over HTTP</text>
  </g>
  </g>
</svg>
