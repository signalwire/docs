<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 829" width="1000" height="829" role="img" aria-label="A benefits question answered from Datasphere: the agent runs a semantic search over vectorized policy documents, answers, then answers a follow-up using the same maternity context.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <line x1="170" y1="110" x2="170" y2="843" class="sw-tie"/>
  <rect x="122" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="170" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Customer</text>
  <line x1="390" y1="110" x2="390" y2="520" class="sw-tie"/>
  <line x1="390" y1="559" x2="390" y2="843" class="sw-tie"/>
  <rect x="342" y="78" width="96" height="32" rx="16" class="sw-chip-fill"/>
  <text x="390" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">AI agent</text>
  <line x1="610" y1="110" x2="610" y2="520" class="sw-tie"/>
  <line x1="610" y1="559" x2="610" y2="843" class="sw-tie"/>
  <rect x="555" y="78" width="110" height="32" rx="16" class="sw-chip-fill"/>
  <text x="610" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Datasphere</text>
  <line x1="830" y1="110" x2="830" y2="843" class="sw-tie"/>
  <rect x="758" y="78" width="144" height="32" rx="16" class="sw-chip-fill"/>
  <text x="830" y="100" text-anchor="middle" class="sw-hd sw-on-chip" font-size="13.5" font-weight="600">Knowledge base</text>
  <text x="280" y="143" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;What&#x27;s covered under my</text>
  <text x="280" y="159" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">maternity benefits?&quot;</text>
  <line x1="170" y1="172" x2="382" y2="172" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="176" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">1</text>
  <text x="500" y="199" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Semantic search for</text>
  <text x="500" y="215" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">maternity coverage</text>
  <line x1="390" y1="228" x2="602" y2="228" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="232" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">2</text>
  <text x="720" y="255" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Query vectorized policy</text>
  <text x="720" y="271" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">documents</text>
  <line x1="610" y1="284" x2="822" y2="284" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="288" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">3</text>
  <text x="720" y="311" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Return relevant policy</text>
  <text x="720" y="327" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">sections</text>
  <line x1="830" y1="340" x2="618" y2="340" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="344" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">4</text>
  <text x="500" y="367" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Contextualized coverage</text>
  <text x="500" y="383" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">details</text>
  <line x1="610" y1="396" x2="398" y2="396" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="400" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">5</text>
  <text x="280" y="423" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Explains maternity benefits</text>
  <text x="280" y="439" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">and coverage limits</text>
  <line x1="390" y1="452" x2="178" y2="452" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="456" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">6</text>
  <text x="280" y="479" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">&quot;And what about prenatal</text>
  <text x="280" y="495" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">care visits?&quot;</text>
  <line x1="170" y1="508" x2="382" y2="508" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="512" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">7</text>
  <rect x="269" y="524" width="462" height="31" rx="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="269" y="524" width="462" height="31" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
  <line x1="269" y1="534" x2="269" y2="545" class="sw-accent-stroke" stroke-width="2.5"/>
  <text x="500" y="544" text-anchor="middle" class="sw-mono" font-size="12" fill="currentColor" fill-opacity="0.66">Keeps the context of the maternity discussion</text>
  <text x="500" y="580" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Search for prenatal care</text>
  <text x="500" y="596" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">coverage</text>
  <line x1="390" y1="609" x2="602" y2="609" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="613" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">8</text>
  <text x="720" y="636" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Query with maternity context</text>
  <line x1="610" y1="649" x2="822" y2="649" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="653" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">9</text>
  <text x="720" y="676" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Return relevant prenatal</text>
  <text x="720" y="692" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">care policies</text>
  <line x1="830" y1="705" x2="618" y2="705" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="709" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">10</text>
  <text x="500" y="732" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Contextualized prenatal care</text>
  <text x="500" y="748" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">info</text>
  <line x1="610" y1="761" x2="398" y2="761" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sw-arrow)"/>
  <text x="26" y="765" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">11</text>
  <text x="280" y="788" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">Details prenatal visit</text>
  <text x="280" y="804" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">coverage within maternity</text>
  <text x="280" y="820" text-anchor="middle" class="sw-hd" font-size="13" fill="currentColor" fill-opacity="0.88">benefits</text>
  <line x1="390" y1="833" x2="178" y2="833" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <text x="26" y="837" text-anchor="middle" class="sw-mono" font-size="10.5" fill="currentColor" fill-opacity="0.4">12</text>
  </g>
  </g>
</svg>
