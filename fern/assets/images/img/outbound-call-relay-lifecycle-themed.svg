<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" width="760" height="662" role="img" aria-labelledby="relay-outbound-title relay-outbound-desc">
  <title id="relay-outbound-title">Relay: commands and events over one bidirectional WebSocket</title>
  <desc id="relay-outbound-desc">Your application and SignalWire share one persistent WebSocket. Your application sends commands to control the call; SignalWire sends live events as the call changes. Your application decides how to react: a call-answered event can trigger play, collected keypad input can trigger connect to a chosen destination, and a playback-finished event can trigger hangup. These are examples of application decisions, not an automatic sequence. Input events require an active collection operation.</desc>
  <g class="relay-theme">
  <defs>
    <style>
      .relay-theme {
        --ink: #070c2d;
        --command: #d91d62;
        --event: #007f83;
        --surface: #ffffff;
        color: var(--ink);
        font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .relay-theme {
          --ink: #f0f0f4;
          --command: #ff4c8d;
          --event: #40e0d0;
          --surface: #0e0e18;
        }
      }
      text { fill: currentColor; text-anchor: middle; }
      .title { font-size: 24px; font-weight: 600; }
      .label { font-size: 21px; font-weight: 600; }
      .detail { font-size: 18px; }
      .small { font-size: 16px; }
      .wire { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; }
      .panel { fill: currentColor; fill-opacity: 0.025; stroke: currentColor; stroke-opacity: 0.13; }
      .node { fill: currentColor; fill-opacity: 0.06; stroke: currentColor; stroke-opacity: 0.2; }
      .channel { fill: var(--surface); stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1.5; }
      .command-text, .command-arrowhead { fill: var(--command); }
      .event-text, .event-arrowhead { fill: var(--event); }
      .command-line { fill: none; stroke: var(--command); stroke-width: 3; }
      .event-line { fill: none; stroke: var(--event); stroke-width: 3; stroke-dasharray: 7 5; }
      .command-card { fill: var(--command); fill-opacity: 0.06; stroke: var(--command); stroke-opacity: 0.5; }
      .event-card { fill: var(--event); fill-opacity: 0.06; stroke: var(--event); stroke-opacity: 0.5; }
      .decision-card { fill: currentColor; fill-opacity: 0.035; stroke: currentColor; stroke-opacity: 0.2; }
      .reaction-line { fill: none; stroke: currentColor; stroke-width: 2; stroke-opacity: 0.55; }
      .reaction-arrowhead { fill: currentColor; fill-opacity: 0.65; }
    </style>
    <marker id="relay-command-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 8 5 0 9z" class="command-arrowhead"/>
    </marker>
    <marker id="relay-event-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 8 5 0 9z" class="event-arrowhead"/>
    </marker>
    <marker id="relay-reaction-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 8 5 0 9z" class="reaction-arrowhead"/>
    </marker>
  </defs>
    <rect x="4" y="4" width="752" height="654" rx="18" class="panel"/>
    <text x="380" y="42" class="title">One persistent, bidirectional WebSocket</text>

    <!-- Both directions occupy the same persistent channel. -->
    <rect x="24" y="78" width="190" height="166" rx="12" class="node"/>
    <text x="119" y="121" class="label">Your application</text>
    <text x="119" y="163" class="detail">Decides what</text>
    <text x="119" y="187" class="detail">happens next</text>
    <rect x="216" y="78" width="328" height="166" rx="12" class="channel"/>
    <text x="380" y="105" class="label command-text">Commands →</text>
    <text x="380" y="128" class="small">dial, play, connect, hangup</text>
    <path d="M224 146 H536" class="command-line" marker-end="url(#relay-command-arrow)"/>
    <path d="M536 180 H224" class="event-line" marker-end="url(#relay-event-arrow)"/>
    <text x="380" y="210" class="label event-text">← Live events</text>
    <text x="380" y="232" class="small">call state, playback, collected input</text>
    <rect x="546" y="78" width="190" height="166" rx="12" class="node"/>
    <text x="641" y="121" class="label">SignalWire</text>
    <text x="641" y="163" class="detail">Places and</text>
    <text x="641" y="187" class="detail">controls the call</text>

    <text x="380" y="286" class="label">Examples: your code reacts to an event</text>
    <text x="130" y="325" class="detail event-text">Event from SignalWire</text>
    <text x="380" y="325" class="detail">Your app decides</text>
    <text x="630" y="325" class="detail command-text">Command to SignalWire</text>

    <!-- Each row is an independent example of an event-driven decision. -->
    <rect x="24" y="344" width="212" height="74" rx="10" class="event-card"/>
    <text x="130" y="374" class="label">Call answered</text>
    <text x="130" y="399" class="wire">calling.call.dial</text>
    <path d="M242 381 H274" class="reaction-line" marker-end="url(#relay-reaction-arrow)"/>
    <rect x="280" y="344" width="200" height="74" rx="10" class="decision-card"/>
    <text x="380" y="387" class="detail">Start the greeting</text>
    <path d="M486 381 H518" class="reaction-line" marker-end="url(#relay-reaction-arrow)"/>
    <rect x="524" y="344" width="212" height="74" rx="10" class="command-card"/>
    <text x="630" y="374" class="label">play(...)</text>
    <text x="630" y="399" class="small">announcement audio</text>

    <rect x="24" y="438" width="212" height="74" rx="10" class="event-card"/>
    <text x="130" y="468" class="label">Digits collected</text>
    <text x="130" y="493" class="wire">calling.call.collect</text>
    <path d="M242 475 H274" class="reaction-line" marker-end="url(#relay-reaction-arrow)"/>
    <rect x="280" y="438" width="200" height="74" rx="10" class="decision-card"/>
    <text x="380" y="481" class="detail">Route to dispatch</text>
    <path d="M486 475 H518" class="reaction-line" marker-end="url(#relay-reaction-arrow)"/>
    <rect x="524" y="438" width="212" height="74" rx="10" class="command-card"/>
    <text x="630" y="468" class="label">connect(...)</text>
    <text x="630" y="493" class="small">chosen destination</text>

    <rect x="24" y="532" width="212" height="74" rx="10" class="event-card"/>
    <text x="130" y="562" class="label">Playback finished</text>
    <text x="130" y="587" class="wire">calling.call.play</text>
    <path d="M242 569 H274" class="reaction-line" marker-end="url(#relay-reaction-arrow)"/>
    <rect x="280" y="532" width="200" height="74" rx="10" class="decision-card"/>
    <text x="380" y="575" class="detail">End the conversation</text>
    <path d="M486 569 H518" class="reaction-line" marker-end="url(#relay-reaction-arrow)"/>
    <rect x="524" y="532" width="212" height="74" rx="10" class="command-card"/>
    <text x="630" y="562" class="label">hangup()</text>
    <text x="630" y="587" class="small">finish this call</text>

    <text x="380" y="640" class="small">Input events require an active collection operation.</text>
  </g>
</svg>
