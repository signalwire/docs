<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 908" width="600" height="908" role="img" aria-labelledby="relay-outbound-title relay-outbound-desc">
  <title id="relay-outbound-title">Relay: commands and events over one WebSocket</title>
  <desc id="relay-outbound-desc">Your code and SignalWire share one persistent WebSocket. Dial: your code sends calling.dial, which SignalWire acknowledges at once; as the call progresses SignalWire sends calling.call.state events created, ringing, and answered, then calling.call.dial answered, which makes dial() return the call. Play: your code sends calling.play; SignalWire sends calling.call.play playing, then finished, which makes action.wait() return. Hang up: your code sends calling.end; SignalWire sends calling.call.state ending, then ended with end_reason hangup.</desc>
  <g class="relay-theme">
  <defs>
    <style>
      .relay-theme {
        --ink: #070c2d;
        --command: #d91d62;
        --event: #007f83;
        --chip: #044EF4;
        --on-chip: #ffffff;
        color: var(--ink);
        font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .relay-theme {
          --ink: #f0f0f4;
          --command: #ff4c8d;
          --event: #40e0d0;
          --chip: #40E0D0;
          --on-chip: #0e0e18;
        }
      }
      text { fill: currentColor; text-anchor: middle; }
      .title { font-size: 22px; font-weight: 600; }
      .label { font-size: 20px; font-weight: 600; }
      .wire { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px; }
      .note { font-size: 15px; fill-opacity: 0.8; }
      .phase { font-size: 15px; font-weight: 600; text-anchor: start; letter-spacing: 0.06em; text-transform: uppercase; fill-opacity: 0.7; }
      .rule { fill: none; stroke: currentColor; stroke-opacity: 0.14; stroke-width: 1; }
      .legend { font-size: 15px; text-anchor: start; }
      .chip { fill: var(--chip); }
      .on-chip { fill: var(--on-chip); }
      .panel { fill: currentColor; fill-opacity: 0.03; stroke: currentColor; stroke-opacity: 0.12; }
      .node { fill: currentColor; fill-opacity: 0.065; stroke: currentColor; stroke-opacity: 0.16; }
      .lifeline { stroke: currentColor; stroke-opacity: 0.22; stroke-width: 1.5; stroke-dasharray: 2 6; }
      .socket { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.5; }
      .socket-head { fill: currentColor; fill-opacity: 0.45; }
      .cmd-line { fill: none; stroke: var(--command); stroke-width: 2.5; }
      .cmd-head, .cmd-text { fill: var(--command); }
      .evt-line { fill: none; stroke: var(--event); stroke-width: 2.5; stroke-dasharray: 6 5; }
      .evt-head, .evt-text { fill: var(--event); }
    </style>
    <marker id="relay-cmd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 8 5 0 9z" class="cmd-head"/></marker>
    <marker id="relay-evt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 8 5 0 9z" class="evt-head"/></marker>
    <marker id="relay-socket-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 8 5 0 9z" class="socket-head"/></marker>
  </defs>
    <rect x="4" y="4" width="592" height="900" rx="18" class="panel"/>
    <line x1="90" y1="114" x2="90" y2="832" class="lifeline"/>
    <rect x="12" y="22" width="156" height="92" rx="12" class="node"/>
    <rect x="68" y="32" width="44" height="40" rx="10" class="chip"/>
    <svg x="76" y="38" width="28" height="28" viewBox="0 0 576 512"><path class="on-chip" d="M205.1 225.5L138.7 344.4c-19.6 2.6-34.7 19.4-34.7 39.6 0 22.1 17.9 40 40 40s40-17.9 40-40c0-5.8-1.2-11.3-3.4-16.2l76.9-137.6c6.4-11.5 2.4-26.1-9.1-32.6-30.4-17.3-46.9-53.3-38-88.9 10.7-42.9 54.1-69 97-58.3 35.6 8.9 59.7 40.3 60.6 75.3 .4 13.2 11.4 23.7 24.7 23.3s23.7-11.4 23.3-24.7c-1.6-56-40-106.3-97-120.5-68.6-17.1-138.1 24.7-155.2 93.3-12.2 48.8 5.5 98 41.3 128.5zm119.5-81.4c2.2-4.9 3.4-10.4 3.4-16.1 0-22.1-17.9-40-40-40s-40 17.9-40 40c0 20.3 15.2 37.1 34.8 39.7l77.3 137.4c3.1 5.5 8.3 9.6 14.5 11.3s12.7 .9 18.2-2.2c30.5-17.2 69.9-12.7 95.8 13.2 31.2 31.2 31.2 81.9 0 113.1-25.9 25.9-65.3 30.4-95.8 13.2-11.5-6.5-26.2-2.4-32.7 9.1s-2.4 26.2 9.1 32.7c48.8 27.5 111.7 20.5 153.3-21.1 50-50 50-131 0-181-35.5-35.5-86.7-45.8-131.2-30.9L324.6 144.1zM432 424c22.1 0 40-17.9 40-40s-17.9-40-40-40c-13.1 0-24.7 6.3-32 16l-152 0c-6.4 0-12.5 2.5-17 7s-7 10.6-7 17c0 34.8-22.9 66.8-58 76.9-42.5 12.2-86.8-12.4-99-54.9-10.1-35.3 5.1-71.8 34.9-90.2 11.3-6.9 14.8-21.7 7.9-33s-21.7-14.8-33-7.9c-47.7 29.3-72.1 87.8-55.9 144.3 19.5 68 90.4 107.2 158.3 87.8 48-13.8 81.7-53.2 90.5-99L400 408c7.3 9.7 18.9 16 32 16z"/></svg>
    <text x="90" y="98" class="title">Your code</text>
    <line x1="370" y1="114" x2="370" y2="832" class="lifeline"/>
    <rect x="292" y="22" width="156" height="92" rx="12" class="node"/>
    <rect x="348" y="32" width="44" height="40" rx="10" class="chip"/>
    <svg x="356" y="38" width="28" height="28" viewBox="0 0 576 512"><path class="on-chip" d="M248 0c13.3 0 24 10.7 24 24l0 464c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-464c0-13.3 10.7-24 24-24zM440 64c13.3 0 24 10.7 24 24l0 336c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-336c0-13.3 10.7-24 24-24zM152 96c13.3 0 24 10.7 24 24l0 272c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-272c0-13.3 10.7-24 24-24zm192 32c13.3 0 24 10.7 24 24l0 208c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-208c0-13.3 10.7-24 24-24zM56 192c13.3 0 24 10.7 24 24l0 80c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-80c0-13.3 10.7-24 24-24zm480 0c13.3 0 24 10.7 24 24l0 80c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-80c0-13.3 10.7-24 24-24z"/></svg>
    <text x="370" y="98" class="title">SignalWire</text>
    <path d="M96 146 H364" class="socket" marker-start="url(#relay-socket-arrow)" marker-end="url(#relay-socket-arrow)"/>
    <text x="230" y="136" class="note">one persistent WebSocket, both directions</text>
    <text x="20" y="186" class="phase">Dial</text>
    <path d="M20 196 H576" class="rule"/>
    <text x="230" y="232" class="label">dial</text>
    <text x="230" y="255" class="wire cmd-text">calling.dial</text>
    <path d="M90 266 H366" class="cmd-line" marker-end="url(#relay-cmd-arrow)"/>
    <text x="487" y="255" class="note">acknowledged at once</text>
    <text x="230" y="298" class="label">created → ringing → answered</text>
    <text x="230" y="321" class="wire evt-text">calling.call.state</text>
    <path d="M370 332 H94" class="evt-line" marker-end="url(#relay-evt-arrow)"/>
    <text x="487" y="321" class="note">as the call progresses</text>
    <text x="230" y="364" class="label">answered</text>
    <text x="230" y="387" class="wire evt-text">calling.call.dial</text>
    <path d="M370 398 H94" class="evt-line" marker-end="url(#relay-evt-arrow)"/>
    <text x="487" y="387" class="note">dial() returns the call</text>
    <text x="20" y="462" class="phase">Play the announcement</text>
    <path d="M20 472 H576" class="rule"/>
    <text x="230" y="508" class="label">play</text>
    <text x="230" y="531" class="wire cmd-text">calling.play</text>
    <path d="M90 542 H366" class="cmd-line" marker-end="url(#relay-cmd-arrow)"/>
    <text x="230" y="574" class="label">playing → finished</text>
    <text x="230" y="597" class="wire evt-text">calling.call.play</text>
    <path d="M370 608 H94" class="evt-line" marker-end="url(#relay-evt-arrow)"/>
    <text x="487" y="597" class="note">action.wait() returns</text>
    <text x="20" y="672" class="phase">Hang up</text>
    <path d="M20 682 H576" class="rule"/>
    <text x="230" y="718" class="label">hangup</text>
    <text x="230" y="741" class="wire cmd-text">calling.end</text>
    <path d="M90 752 H366" class="cmd-line" marker-end="url(#relay-cmd-arrow)"/>
    <text x="230" y="784" class="label">ending → ended</text>
    <text x="230" y="807" class="wire evt-text">calling.call.state</text>
    <path d="M370 818 H94" class="evt-line" marker-end="url(#relay-evt-arrow)"/>
    <text x="487" y="807" class="note">end_reason: hangup</text>
    <path d="M120 878 H160" class="cmd-line" marker-end="url(#relay-cmd-arrow)"/>
    <text x="170" y="883" class="legend">Command you send</text>
    <path d="M340 878 H380" class="evt-line" marker-end="url(#relay-evt-arrow)"/>
    <text x="390" y="883" class="legend">Event from SignalWire</text>
  </g>
</svg>
