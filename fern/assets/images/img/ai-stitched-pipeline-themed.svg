<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 258" width="1000" height="258" role="img" aria-label="A voice AI stack assembled from separate services: after the caller stops speaking, audio crosses the network to the telephony provider, a speech-to-text service, a language model, a text-to-speech service, and back through the telephony provider before the caller hears the reply.">
  <g class="sw-theme">
  <defs>
    <radialGradient id="sw-orb-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.10"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sw-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sw-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
    </pattern>
    <clipPath id="sw-card">
      <rect x="8" y="8" width="984" height="242" rx="20"/>
    </clipPath>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>

  <rect x="8" y="8" width="984" height="242" rx="20" fill="currentColor" fill-opacity="0.035"/>
  <g clip-path="url(#sw-card)">
    <circle cx="880" cy="8" r="300" fill="url(#sw-orb-purple)"/>
    <circle cx="90" cy="258" r="280" fill="url(#sw-orb-fuchsia)"/>
    <rect x="8" y="8" width="984" height="242" fill="url(#sw-dots)"/>
  </g>
  <rect x="8" y="8" width="984" height="242" rx="20" fill="none" stroke="currentColor" stroke-opacity="0.13" stroke-width="1.5"/>
  <line x1="40" y1="47" x2="64" y2="47" class="sw-accent-stroke" stroke-width="2"/>
  <text x="72" y="52" class="sw-mono sw-accent" font-size="12" font-weight="700" letter-spacing="1.7">SEPARATE SERVICES, ONE HOP EACH</text>
  <rect x="50" y="112" width="110" height="58" rx="29" class="sw-chip-fill"/>
  <text x="105" y="137" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">Caller stops</text>
  <text x="105" y="155" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">speaking</text>
  <line x1="164" y1="141" x2="174" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="182" y="112" width="110" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="182" y="112" width="110" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="237" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Telephony</text>
  <text x="237" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">provider</text>
  <line x1="295" y1="141" x2="305" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="313" y="112" width="110" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="313" y="112" width="110" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="368" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Speech-to-text</text>
  <text x="368" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">service</text>
  <line x1="427" y1="141" x2="437" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="445" y="112" width="110" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="445" y="112" width="110" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="500" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Language</text>
  <text x="500" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">model</text>
  <line x1="559" y1="141" x2="569" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="577" y="112" width="110" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="577" y="112" width="110" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="632" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Text-to-speech</text>
  <text x="632" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">service</text>
  <line x1="691" y1="141" x2="701" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="709" y="112" width="110" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="709" y="112" width="110" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="763" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Telephony</text>
  <text x="763" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">provider</text>
  <line x1="822" y1="141" x2="832" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="840" y="112" width="110" height="58" rx="29" class="sw-chip-fill"/>
  <text x="895" y="137" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">Caller hears</text>
  <text x="895" y="155" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">the reply</text>
  <text x="500.0" y="230" text-anchor="middle" class="sw-mono" font-size="11.5" letter-spacing="1.1" fill="currentColor" fill-opacity="0.5">every arrow is a network hop, on every turn</text>
  </g>
</svg>
