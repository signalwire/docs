<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 178" width="1000" height="178" role="img" aria-label="A voice AI stack assembled from separate services: after the caller stops speaking, audio crosses the network to the telephony provider, a speech-to-text service, a language model, a text-to-speech service, and back through the telephony provider before the caller hears the reply.">
  <g class="sw-theme">
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>

    <style>
      /* One file for both modes, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. */
      .sw-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --sw-ink: #070c2d;
        --sw-chip: #044EF4;
        --sw-on-chip: #ffffff;
        color: var(--sw-ink);
      }
      @media (prefers-color-scheme: dark) {
        .sw-theme {
          --sw-ink: #f0f0f4;
          --sw-chip: #40E0D0;
          --sw-on-chip: #0e0e18;
        }
      }
      .sw-accent { fill: var(--sw-fuchsia); }
      .sw-accent-stroke { stroke: var(--sw-fuchsia); }
      .sw-chip-fill { fill: var(--sw-chip); }
      .sw-on-chip { fill: var(--sw-on-chip); }
      #sw-orb-purple stop { stop-color: var(--sw-purple); }
      #sw-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .sw-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .sw-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .sw-tie { stroke: currentColor; stroke-opacity: 0.32; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>

  </defs>
  <g transform="translate(0,-54)">
  <rect x="50" y="112" width="99" height="58" rx="29" class="sw-chip-fill"/>
  <text x="100" y="128" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">Caller</text>
  <text x="100" y="146" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">stops</text>
  <text x="100" y="164" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">speaking</text>
  <line x1="155" y1="141" x2="177" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="183" y="112" width="99" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="183" y="112" width="99" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="233" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Telephony</text>
  <text x="233" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">provider</text>
  <line x1="289" y1="141" x2="311" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="317" y="112" width="99" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="317" y="112" width="99" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="367" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Speech-to-text</text>
  <text x="367" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">service</text>
  <line x1="422" y1="141" x2="444" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="450" y="112" width="99" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="450" y="112" width="99" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="500" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Language</text>
  <text x="500" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">model</text>
  <line x1="556" y1="141" x2="578" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="584" y="112" width="99" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="584" y="112" width="99" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="633" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Text-to-speech</text>
  <text x="633" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">service</text>
  <line x1="689" y1="141" x2="711" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="717" y="112" width="99" height="58" rx="12" fill="currentColor" fill-opacity="0.06"/>
  <rect x="717" y="112" width="99" height="58" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="767" y="137" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">Telephony</text>
  <text x="767" y="155" text-anchor="middle" class="sw-hd" fill="currentColor" fill-opacity="0.88" font-size="14">provider</text>
  <line x1="823" y1="141" x2="845" y2="141" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.8" marker-end="url(#sw-arrow)"/>
  <rect x="851" y="112" width="99" height="58" rx="29" class="sw-chip-fill"/>
  <text x="900" y="128" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">Caller</text>
  <text x="900" y="146" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">hears the</text>
  <text x="900" y="164" text-anchor="middle" class="sw-hd sw-on-chip" font-size="14">reply</text>
  </g>
  </g>
</svg>
