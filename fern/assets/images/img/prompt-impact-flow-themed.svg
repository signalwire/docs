<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 646" width="1000" height="646" role="img" aria-label="A taxi booking call, turn by turn: the role and response guidelines shape the greeting, the task structure and knowledge base drive the pickup-address question, the response guidelines set expectations about the trip, and the guardrails leave the fare to the get_quote function.">
  <g class="swprompt-theme">
  <defs>
    <radialGradient id="swprompt-orb-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.10"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="swprompt-orb-fuchsia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="swprompt-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.05"/>
    </pattern>
    <clipPath id="swprompt-card">
      <rect x="8" y="8" width="984" height="630" rx="20"/>
    </clipPath>
    <marker id="swprompt-arrow-n" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="currentColor" fill-opacity="0.45"/>
    </marker>
    <style>
      /* Companion to ai-agent-flow-themed.svg: one file for both modes, no
         .light-only / .dark-only pair, embedded as a plain img tag.

         The docs set `color-scheme` on the html element (per Fern's theme
         toggle), that inherits to the img element, and the browser propagates
         it into this SVG's own document, so the media query below tracks the
         site toggle rather than the visitor's OS setting. Where a browser
         hasn't implemented that propagation it falls back to the OS
         preference, which is what the toggle defaults to anyway.

         Colors are literal brand hexes: custom properties do not cross
         document boundaries, so nothing from the page reaches an img-embedded
         SVG. var() is also invalid in SVG presentation attributes, so colored
         fills and strokes go through the classes below. */
      .swprompt-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --swprompt-ink: #070c2d;
        --swprompt-chip: #044EF4;      /* SW Blue, matching accent-primary light */
        --swprompt-on-chip: #ffffff;
        --swprompt-caller-icon: var(--swprompt-ink);
        color: var(--swprompt-ink);
      }
      @media (prefers-color-scheme: dark) {
        .swprompt-theme {
          --swprompt-ink: #f0f0f4;
          --swprompt-chip: #40E0D0;    /* SW Turquoise, matching accent-primary dark */
          --swprompt-on-chip: #0e0e18;
          --swprompt-caller-icon: #40E0D0;
        }
      }
      .swprompt-accent { fill: var(--sw-fuchsia); }
      .swprompt-accent-stroke { stroke: var(--sw-fuchsia); }
      .swprompt-chip { fill: var(--swprompt-chip); }
      .swprompt-glyph { fill: var(--swprompt-on-chip); }
      .swprompt-caller-glyph { fill: var(--swprompt-caller-icon); }
      #swprompt-orb-purple stop { stop-color: var(--sw-purple); }
      #swprompt-orb-fuchsia stop { stop-color: var(--sw-fuchsia); }
      .swprompt-hd { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; }
      .swprompt-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .swprompt-tie { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.5; stroke-dasharray: 3 4; }
    </style>
  </defs>

