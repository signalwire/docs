<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="legs-title legs-desc">
  <title id="legs-title">One call, two legs</title>
  <desc id="legs-desc">A caller is connected to SignalWire by the A-leg, and SignalWire is connected to the destination by the B-leg. The A-leg is inbound and has its own Call ID. The B-leg is outbound, has its own Call ID, and names the A-leg as its parent. Once bridged, each leg's peer is the other. Each leg is its own log record and its own charge.</desc>
  <g class="swflow-theme">
  <defs>
    <style>
      .swflow-theme {
        --sw-fuchsia: #F72A72;
        --sw-purple: #601BE6;
        --swflow-ink: #070c2d;
        --swflow-chip: #044EF4;
        --swflow-on-chip: #ffffff;
        color: var(--swflow-ink);
        font-family: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
        font-size: 20px;
      }
      @media (prefers-color-scheme: dark) {
        .swflow-theme {
          --swflow-ink: #f0f0f4;
          --swflow-chip: #40E0D0;
          --swflow-on-chip: #0e0e18;
        }
      }
      .swflow-chip { fill: var(--swflow-chip); }
      .swflow-on-chip { fill: var(--swflow-on-chip); }
      .swflow-panel { fill: currentColor; fill-opacity: 0.03; stroke: currentColor; stroke-opacity: 0.12; }
      .swflow-node { fill: currentColor; fill-opacity: 0.065; stroke: currentColor; stroke-opacity: 0.16; }
      .swflow-note { fill: var(--sw-purple); fill-opacity: 0.08; stroke: var(--sw-purple); stroke-opacity: 0.45; }
      .swflow-leg { fill: none; stroke: var(--sw-fuchsia); stroke-width: 4; stroke-linecap: round; }
      .swflow-bridge { fill: none; stroke: var(--sw-purple); stroke-width: 2; stroke-dasharray: 6 6; }
      text { fill: currentColor; text-anchor: middle; }
      .swflow-title { font-size: 22px; font-weight: 600; }
      .swflow-label { font-weight: 600; fill: var(--sw-fuchsia); }
      .swflow-detail { font-size: 18px; }
      .swflow-mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 17px; }
    </style>
  </defs>
    <rect x="4" y="4" width="752" height="492" rx="18" class="swflow-panel"/>

    <!-- Participants -->
    <rect x="22" y="22" width="156" height="92" rx="12" class="swflow-node"/>
    <rect x="78" y="32" width="44" height="40" rx="10" class="swflow-chip"/>
    <svg x="86" y="38" width="28" height="28" viewBox="0 0 512 512"><path class="swflow-on-chip" d="M112.8 10.9c27.3-9.1 57 3.9 68.9 30l39.7 87.3c10.6 23.4 4 51-16 67.1l-24.2 19.3c25.5 50 65.5 91.4 114.4 118.8l21.2-26.6c16.1-20.1 43.7-26.7 67.1-16l87.3 39.7c26.2 11.9 39.1 41.6 30 68.9-20.7 62.3-83.7 116.2-160.9 102.6-173.7-30.6-299.6-156.5-330.2-330.2-13.6-77.2 40.4-140.1 102.6-160.9zm25.2 49.9c-1.7-3.8-6-5.7-10-4.4-45.2 15.1-79.1 58.6-70.5 107 27.1 153.8 137.4 264.2 291.2 291.3 48.4 8.5 91.9-25.3 107-70.5 1.3-4-.6-8.3-4.4-10L364 334.4c-3.4-1.5-7.4-.6-9.7 2.3l-33.5 41.9c-7 8.7-19 11.5-29 6.7-72.5-34.4-130.5-94.3-162.4-168.2-4.3-9.9-1.4-21.5 7-28.2l38.9-31.1c2.9-2.3 3.9-6.3 2.3-9.7L137.9 60.7z"/></svg>
    <text x="100" y="98" class="swflow-title">Caller</text>

    <rect x="302" y="22" width="156" height="92" rx="12" class="swflow-node"/>
    <rect x="358" y="32" width="44" height="40" rx="10" class="swflow-chip"/>
    <svg x="366" y="38" width="28" height="28" viewBox="0 0 576 512"><path class="swflow-on-chip" d="M248 0c13.3 0 24 10.7 24 24l0 464c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-464c0-13.3 10.7-24 24-24zM440 64c13.3 0 24 10.7 24 24l0 336c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-336c0-13.3 10.7-24 24-24zM152 96c13.3 0 24 10.7 24 24l0 272c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-272c0-13.3 10.7-24 24-24zm192 32c13.3 0 24 10.7 24 24l0 208c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-208c0-13.3 10.7-24 24-24zM56 192c13.3 0 24 10.7 24 24l0 80c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-80c0-13.3 10.7-24 24-24zm480 0c13.3 0 24 10.7 24 24l0 80c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-80c0-13.3 10.7-24 24-24z"/></svg>
    <text x="380" y="98" class="swflow-title">SignalWire</text>

    <rect x="582" y="22" width="156" height="92" rx="12" class="swflow-node"/>
    <rect x="638" y="32" width="44" height="40" rx="10" class="swflow-chip"/>
    <svg x="646" y="38" width="28" height="28" viewBox="0 0 512 512"><path class="swflow-on-chip" d="M112.8 10.9c27.3-9.1 57 3.9 68.9 30l39.7 87.3c10.6 23.4 4 51-16 67.1l-24.2 19.3c25.5 50 65.5 91.4 114.4 118.8l21.2-26.6c16.1-20.1 43.7-26.7 67.1-16l87.3 39.7c26.2 11.9 39.1 41.6 30 68.9-20.7 62.3-83.7 116.2-160.9 102.6-173.7-30.6-299.6-156.5-330.2-330.2-13.6-77.2 40.4-140.1 102.6-160.9zm25.2 49.9c-1.7-3.8-6-5.7-10-4.4-45.2 15.1-79.1 58.6-70.5 107 27.1 153.8 137.4 264.2 291.2 291.3 48.4 8.5 91.9-25.3 107-70.5 1.3-4-.6-8.3-4.4-10L364 334.4c-3.4-1.5-7.4-.6-9.7 2.3l-33.5 41.9c-7 8.7-19 11.5-29 6.7-72.5-34.4-130.5-94.3-162.4-168.2-4.3-9.9-1.4-21.5 7-28.2l38.9-31.1c2.9-2.3 3.9-6.3 2.3-9.7L137.9 60.7z"/></svg>
    <text x="660" y="98" class="swflow-title">Destination</text>

    <!-- Legs -->
    <line x1="178" y1="68" x2="302" y2="68" class="swflow-leg"/>
    <text x="240" y="58" class="swflow-label">A-leg</text>
    <line x1="458" y1="68" x2="582" y2="68" class="swflow-leg"/>
    <text x="520" y="58" class="swflow-label">B-leg</text>

    <!-- A-leg details -->
    <rect x="22" y="150" width="340" height="196" rx="12" class="swflow-node"/>
    <text x="192" y="184" class="swflow-title">A-leg</text>
    <text x="192" y="216" class="swflow-detail">The caller's call to your number</text>
    <text x="192" y="246" class="swflow-mono">direction: inbound</text>
    <text x="192" y="272" class="swflow-mono">call_id: a1b2…</text>
    <text x="192" y="298" class="swflow-mono">peer.call_id: c3d4…</text>

    <!-- B-leg details -->
    <rect x="398" y="150" width="340" height="196" rx="12" class="swflow-node"/>
    <text x="568" y="184" class="swflow-title">B-leg</text>
    <text x="568" y="216" class="swflow-detail">The leg SignalWire dials for you</text>
    <text x="568" y="246" class="swflow-mono">direction: outbound</text>
    <text x="568" y="272" class="swflow-mono">call_id: c3d4…</text>
    <text x="568" y="298" class="swflow-mono">parent.call_id: a1b2…</text>
    <text x="568" y="324" class="swflow-mono">peer.call_id: a1b2…</text>

    <!-- Bridge -->
    <line x1="362" y1="248" x2="398" y2="248" class="swflow-bridge"/>

    <!-- Shared note -->
    <rect x="22" y="372" width="716" height="104" rx="12" class="swflow-note"/>
    <text x="380" y="406" class="swflow-detail">Each leg is its own log record, Segment ID, and charge.</text>
    <text x="380" y="434" class="swflow-detail">Once bridged, each leg's peer is the other.</text>
    <text x="380" y="462" class="swflow-detail">The B-leg also names the A-leg as its parent.</text>
  </g>
</svg>
