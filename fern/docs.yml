  - source: /docs/server-sdk/:slug*
    destination: /docs/server-sdks/:slug*
  # Browser SDK v3 guides removed (v3 is deprecated); point old guide URLs at
  # the v4 migration guide, which covers the v3->v4 API mapping and flags the
  # features v4 does not implement yet. These must precede the general
  # /docs/browser-sdk/js/:slug* wildcard below, which would otherwise send
  # guide paths into the now-deleted v3 guides tree.
  - source: /docs/browser-sdk/v3/js/guides
    destination: /docs/browser-sdk/guides/migrate-from-v3
  - source: /docs/browser-sdk/v3/js/guides/:slug*
    destination: /docs/browser-sdk/guides/migrate-from-v3
  - source: /docs/browser-sdk/js/guides
    destination: /docs/browser-sdk/guides/migrate-from-v3
  - source: /docs/browser-sdk/js/guides/:slug*
    destination: /docs/browser-sdk/guides/migrate-from-v3

  - source: /docs/browser-sdk/js
    destination: /docs/browser-sdk/v3/js
  - source: /docs/browser-sdk/js/:slug*
    destination: /docs/browser-sdk/v3/js/:slug*
  - source: /docs/browser-sdk/click-to-call
    destination: /docs/browser-sdk/v3/click-to-call
  - source: /docs/browser-sdk/click-to-call/:slug*
    destination: /docs/browser-sdk/v3/click-to-call/:slug*

  # The SWMLService `onRequest` override hook is now protected (renamed
  # `buildSwmlForRequest`) and no longer documented; point its old page URL at
  # the public equivalent, `setOnRequestCallback`.
  - source: /docs/server-sdks/reference/typescript/agents/swml-service/on-request
    destination: /docs/server-sdks/reference/typescript/agents/swml-service/set-on-request-callback

  # The prompt writing techniques guide duplicated the prompt engineering
  # overview; the additive parts were merged into it and the page removed.
  - source: /docs/platform/ai/prompt-engineering/best-practices
    destination: /docs/platform/ai/prompt-engineering

  # Prompt surfaces now live in the consolidated prompt engineering guide.
  - source: /docs/platform/ai/prompt-engineering/where-to-apply
    destination: /docs/platform/ai/prompt-engineering

  # The VAPI inbound and outbound guides were merged into one integration guide.
  - source: /docs/platform/ai/vapi/inbound
    destination: /docs/platform/ai/vapi
  - source: /docs/platform/ai/vapi/outbound
    destination: /docs/platform/ai/vapi

  # SWML methods reorganized into calling/ and messaging/ subsections.
  # The old methods overview lived at /docs/swml/reference, which was
  # entirely calling-flavored — point it at the new calling overview.
  - source: /docs/swml/reference
    destination: /docs/swml/reference/calling

