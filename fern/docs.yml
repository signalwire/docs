theme:
  colors:
    primary: "#044ef4"
    background: "#ffffff"
  font:
    heading: "Instrument Sans"
    body: "Instrument Sans"
    mono: "JetBrains Mono"
  logo:
    light: "/assets/logo-no-text.svg"
    dark: "/assets/logo-no-text.svg"
  favicon: "/assets/favicon.ico"
layout:
  header:
    links:
      - label: "Dashboard"
        href: "https://dashboard.signalwire.com"
      - label: "Sign Up"
        href: "https://signalwire.com/signup"
        style: "primary"
  footer:
    copyright: "Copyright © 2024 SignalWire Inc."
    links:
      - label: "GitHub"
        href: "https://github.com/signalwire"
      - label: "Discord"
        href: "https://discord.com/invite/F2WNYTNjuF"
      - label: "Twitter"
        href: "https://twitter.com/signalwire"
      - label: "Status"
        href: "https://status.signalwire.com"
