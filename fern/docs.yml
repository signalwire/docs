instance: signalwire
version: 0.1.0
navigation:
  - tab: Products
    groups:
      - group: Voice & Video
        pages:
          - page: Voice API
            path: voice-api
          - page: Video API
            path: video-api
          - page: SWML
            path: swml
      - group: Messaging
        pages:
          - page: SMS & MMS
            path: messaging
          - page: WhatsApp
            path: whatsapp
      - group: AI Agents
        pages:
          - page: Agents SDK
            path: agents-sdk
          - page: Call Flow Builder
            path: call-flow-builder
  - tab: SDKs
    groups:
      - group: Server SDKs
        pages:
          - page: Node.js
            path: server-sdks/node
          - page: Python
            path: server-sdks/python
          - page: PHP
            path: server-sdks/php
          - page: Ruby
            path: server-sdks/ruby
          - page: Go
            path: server-sdks/go
          - page: .NET
            path: server-sdks/dotnet
          - page: Java
            path: server-sdks/java
      - group: Browser & Mobile SDKs
        pages:
          - page: Browser SDK
            path: browser-sdk
          - page: React Native
            path: react-native
          - page: iOS
            path: ios
          - page: Android
            path: android
  - tab: APIs
    groups:
      - group: REST APIs
        pages:
          - page: API Reference
            path: api/reference
          - page: Authentication
            path: api/authentication
          - page: Webhooks
            path: api/webhooks
      - group: Compatibility API
        pages:
          - page: TwiML Migration
            path: compatibility-api
  - tab: Resources
    groups:
      - group: Guides
        pages:
          - page: Getting Started
            path: getting-started
          - page: Developer Resources
            path: developer-resources
      - group: Reference
        pages:
          - page: Available Countries
            path: available-countries
          - page: Pricing
            path: pricing
          - page: Support
            path: support
