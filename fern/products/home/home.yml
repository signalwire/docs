# The homepage is its own product so it can live at the bare /docs: a page's
# frontmatter slug never escapes its product, so inside Platform it would land
# at /docs/platform. The product switcher hides this product (fern/styles.css).
#
# The Platform, Calling, AI, and Messaging tabs mirror the Platform product's
# tabs as links, so the homepage shows the same tab bar on purpose. Keep them
# in step with fern/products/platform/platform.yml, which links back here
# through its own Home tab.
tabs:
  home:
    display-name: Home
    icon: fa-regular fa-home
  platform:
    display-name: Platform
    icon: fa-regular fa-planet-ringed
    href: /docs/platform/getting-started
  calling:
    display-name: Calling
    icon: fa-regular fa-waveform-lines
    href: /docs/platform/calling
  ai:
    display-name: AI
    icon: fa-regular fa-robot
    href: /docs/platform/ai
  messaging:
    display-name: Messaging
    icon: fa-regular fa-message-dots
    href: /docs/platform/messaging

navigation:
  - tab: home
    layout:
      - page: Home
        path: ./pages/welcome.mdx
  - tab: platform
  - tab: calling
  - tab: ai
  - tab: messaging
