# EXPERIMENT: re-adds the SWML messaging schemas that the TypeSpec emitter drops
# once no operation references them, so <Schema> can be tested against orphan types.
components:
  schemas:
    SWML.Messaging.Execute:
      type: object
      required:
      - execute
      properties:
        execute:
          type: object
          properties:
            dest:
              type: string
              description: Name of the section to execute. Must reference a section in the current document.
              examples:
              - greet
            params:
              type: object
              unevaluatedProperties: {}
              description: Parameters accessible as `params.*` in the called section. Replaces (does not merge with) any outer `params` from the caller.
              examples:
              - name: '%{message.from}'
          required:
          - dest
          unevaluatedProperties:
            not: {}
          description: 'Call a named section as a subroutine. Execution continues in the called section,

            then returns to the caller when the section completes — either via `return` or by

            reaching the end of the section. The destination must be the name of a section

            defined in the current document; URLs and inline documents are not accepted in the

            messaging context.'
          title: execute
      unevaluatedProperties:
        not: {}
      title: execute Method
    SWML.Messaging.Goto:
      type: object
      required:
      - goto
      properties:
        goto:
          type: object
          properties:
            label:
              type: string
              description: Label to jump to. Must reference a `label` step in the current section.
              examples:
              - greeting
            max:
              type: integer
              description: 'Maximum number of times this `goto` can jump to its label. Once the limit is reached,

                the section ends without running any further steps.'
              examples:
              - 3
              default: 100
          required:
          - label
          unevaluatedProperties:
            not: {}
          description: 'Jump to a named label in the current section. Used for retry loops and conditional

            repetition. `goto` does not cross subroutine boundaries.'
          title: goto
      unevaluatedProperties:
        not: {}
      title: goto Method
    SWML.Messaging.Label:
      type: object
      required:
      - label
      properties:
        label:
          type: string
          description: 'Mark any point of the SWML section with a label so that `goto` can jump to it. Must be

            unique within the section.'
          examples:
          - greeting
      unevaluatedProperties:
        not: {}
      title: label Method
    SWML.Messaging.Receive:
      type: object
      required:
      - receive
      properties:
        receive:
          type: object
          unevaluatedProperties:
            not: {}
          description: Accept the inbound message without sending a reply. No-op step.
          title: receive
          examples:
          - {}
      unevaluatedProperties:
        not: {}
      title: receive Method
    SWML.Messaging.Reply:
      type: object
      required:
      - reply
      properties:
        reply:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/SWML.Messaging.ReplyWithBody'
          - $ref: '#/components/schemas/SWML.Messaging.ReplyWithMedia'
          - $ref: '#/components/schemas/SWML.Messaging.ReplyInlineSwitch'
          description: 'Create and send an outbound message in response to the inbound message. Accepts one of:

            a string (used as the message body), an object with body, media, and routing fields, or

            an inline `switch` that branches the reply on a variable value.


            `reply` does not end execution — subsequent steps in the section continue to run after

            the reply is queued.'
          title: reply
      unevaluatedProperties:
        not: {}
      title: reply Method
    SWML.Messaging.ReplyInlineSwitch:
      type: object
      required:
      - switch
      properties:
        switch:
          type: object
          properties:
            variable:
              type: string
              description: Variable path to match. Specified without the `%{}` wrapper (e.g. `message.body`).
              examples:
              - message.body
            transform:
              allOf:
              - $ref: '#/components/schemas/SWML.Messaging.SwitchTransform'
              description: Transform to apply to the value before matching.
              examples:
              - lowercase_trim
            case:
              type: object
              unevaluatedProperties:
                anyOf:
                - type: string
                - $ref: '#/components/schemas/SWML.Messaging.ReplyWithBody'
                - $ref: '#/components/schemas/SWML.Messaging.ReplyWithMedia'
              description: 'Map of values to reply outcomes. Each entry''s value is either a string (used as

                the reply body, sent back to the original sender as SMS) or a full reply object

                (`body`, `media`, `to`, `from`, `status_url`). Use the object form when the

                branch needs media, a different destination, or a per-branch `status_url`.'
            default:
              anyOf:
              - type: string
              - $ref: '#/components/schemas/SWML.Messaging.ReplyWithBody'
              - $ref: '#/components/schemas/SWML.Messaging.ReplyWithMedia'
              description: 'Fallback used when no `case` value matches. Same string-or-reply-object shape as a

                `case` value. If omitted and no case matches, the `reply` step fails and execution

                stops.'
          required:
          - variable
          - case
          unevaluatedProperties:
            not: {}
      unevaluatedProperties:
        not: {}
      description: "Branch the reply on a variable value. The matched `case` (or `default`) supplies the\nreply contents in one of two forms:\n\n- **String** — sent back to the original sender as the SMS body. The simplest form,\n  good for choosing between canned text responses.\n- **Reply object** — a full `{ body, media, to, from, status_url }` block, so the\n  matched branch can attach media, override the destination, or set a per-branch\n  status callback. Any `%{…}` placeholders inside the object are expanded before\n  the reply is sent.\n\nWhen you use an inline `switch`, do not set `body`, `media`, `to`, `from`, or\n`status_url` directly on the same `reply` — put them inside each `case` value\n(or `default`) instead."
      title: Reply with inline switch
    SWML.Messaging.ReplyWithBody:
      type: object
      required:
      - body
      properties:
        to:
          type: string
          description: Destination phone number in E.164 format. Defaults to the inbound message's `from`.
          examples:
          - '+15551234567'
        from:
          type: string
          description: Sending phone number or short code. Must be owned by your project and have messaging capability. Defaults to the inbound message's `to`.
          examples:
          - '+15559876543'
        status_url:
          type: string
          format: uri
          description: URL that receives delivery status callbacks for the outbound reply. The callback uses the [message status callback payload](/docs/apis/rest/webhooks/message-status-callback).
          examples:
          - https://example.com/reply-status
        body:
          type: string
          minLength: 1
          description: Body text of the reply. Must be a non-empty string. Required if `media` is not present.
          examples:
          - Thanks for your message!
        media:
          type: array
          items:
            type: string
            format: uri
          maxItems: 8
          description: Array of media URLs to attach. Converts the message to MMS. Maximum 8 attachments.
          examples:
          - - https://example.com/image.jpg
      unevaluatedProperties:
        not: {}
      title: Reply with body
    SWML.Messaging.ReplyWithMedia:
      type: object
      required:
      - media
      properties:
        to:
          type: string
          description: Destination phone number in E.164 format. Defaults to the inbound message's `from`.
          examples:
          - '+15551234567'
        from:
          type: string
          description: Sending phone number or short code. Must be owned by your project and have messaging capability. Defaults to the inbound message's `to`.
          examples:
          - '+15559876543'
        status_url:
          type: string
          format: uri
          description: URL that receives delivery status callbacks for the outbound reply. The callback uses the [message status callback payload](/docs/apis/rest/webhooks/message-status-callback).
          examples:
          - https://example.com/reply-status
        media:
          type: array
          items:
            type: string
            format: uri
          maxItems: 8
          description: Array of media URLs to attach. Converts the message to MMS. Maximum 8 attachments. Required if `body` is not present.
          examples:
          - - https://example.com/image.jpg
        body:
          type: string
          minLength: 1
          description: Optional body text included alongside the media attachments. Must be a non-empty string if provided.
          examples:
          - Check out this image!
      unevaluatedProperties:
        not: {}
      title: Reply with media
    SWML.Messaging.Request:
      type: object
      required:
      - request
      properties:
        request:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: Endpoint to call. Must be a publicly reachable URL.
              examples:
              - https://api.example.com/lookup
            method:
              type: string
              enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              description: HTTP method.
              examples:
              - POST
              default: POST
            headers:
              type: object
              unevaluatedProperties:
                type: string
              description: HTTP headers to include with the request, as a map of header name to value. Each value must be a string.
              examples:
              - Authorization: Bearer token
            body:
              anyOf:
              - type: string
              - type: object
                unevaluatedProperties: {}
              description: Request body. Objects are JSON-encoded automatically.
              examples:
              - phone: '%{message.from}'
            timeout:
              type: number
              minimum: 0
              maximum: 5
              description: Timeout in seconds. Clamped to a maximum of `5.0`.
              examples:
              - 3
              default: 5
            save_variables:
              type: boolean
              description: If `true`, parse the JSON response into `request_response.*` variables.
              examples:
              - true
              default: false
          required:
          - url
          unevaluatedProperties:
            not: {}
          description: "Make an HTTP request from inside your SWML document — useful for looking up\nrecords, calling your own API, or fetching data to use later in the message flow.\n\nAfter the request, the `%{request_result}` variable tells you the outcome:\n\n- `\"success\"` — the URL returned a 2xx response.\n- `\"failed\"` — the URL returned a 4xx or 5xx, or the network call failed.\n- `\"timeout\"` — the request didn't respond within `timeout` seconds.\n- `\"limit_exceeded\"` — your document already made the maximum of 10 requests;\n  this call was skipped.\n\nNetwork and HTTP errors don't stop your document — the next steps still run,\nso you can branch on `%{request_result}` to handle each outcome. The only\nfatal error is omitting `url`.\n\nWhen `save_variables` is `true` and the response body is JSON, the parsed\nfields are available as `%{request_response.<field>}`. The raw response\nstatus code is in `%{request_response_code}` and the raw body in\n`%{request_response_body}` (capped at 64 KB)."
          title: request
      unevaluatedProperties:
        not: {}
      title: request Method
    SWML.Messaging.Return:
      type: object
      required:
      - return
      properties:
        return:
          description: 'Return from the current section. Inside a subroutine called via `execute`, control

            returns to the caller and the value is accessible as `return_value` in the caller''s

            context. In `main`, stops execution entirely (return value is discarded). To return

            without a value, use `return: null`.'
          title: return
          examples:
          - success
      unevaluatedProperties:
        not: {}
      title: return Method
    SWML.Messaging.SWMLMethod:
      anyOf:
      - $ref: '#/components/schemas/SWML.Messaging.Reply'
      - $ref: '#/components/schemas/SWML.Messaging.Receive'
      - $ref: '#/components/schemas/SWML.Messaging.Request'
      - $ref: '#/components/schemas/SWML.Messaging.Execute'
      - $ref: '#/components/schemas/SWML.Messaging.Transfer'
      - $ref: '#/components/schemas/SWML.Messaging.Switch'
      - $ref: '#/components/schemas/SWML.Messaging.Goto'
      - $ref: '#/components/schemas/SWML.Messaging.Return'
      - $ref: '#/components/schemas/SWML.Messaging.Label'
      title: SWML methods
    SWML.Messaging.SWMLObject:
      type: object
      required:
      - sections
      properties:
        version:
          type: string
          enum:
          - 1.0.0
        sections:
          $ref: '#/components/schemas/SWML.Messaging.Section'
      unevaluatedProperties:
        not: {}
      description: 'A SWML document for handling inbound SMS or MMS messages. The document has a top-level

        `sections` map; execution starts at `sections.main`, and each section is an ordered array of

        methods. Additional sections can be invoked via `execute`, `transfer`, or `goto`.


        See the [Messaging SWML reference](/docs/swml/reference/messaging) for the full list of

        available methods.'
      title: Messaging SWML Document
    SWML.Messaging.Section:
      type: object
      required:
      - main
      properties:
        main:
          type: array
          items:
            $ref: '#/components/schemas/SWML.Messaging.SWMLMethod'
      unevaluatedProperties:
        type: array
        items:
          $ref: '#/components/schemas/SWML.Messaging.SWMLMethod'
      title: SWML section
    SWML.Messaging.Switch:
      type: object
      required:
      - switch
      properties:
        switch:
          type: object
          properties:
            variable:
              type: string
              description: Variable path to match. Specified without the `%{}` wrapper (e.g. `message.body`).
              examples:
              - message.body
            transform:
              allOf:
              - $ref: '#/components/schemas/SWML.Messaging.SwitchTransform'
              description: Transform to apply to the value before matching.
              examples:
              - lowercase_trim
            case:
              type: object
              unevaluatedProperties:
                type: array
                items:
                  $ref: '#/components/schemas/SWML.Messaging.SWMLMethod'
              description: 'Map of values to arrays of SWML methods to execute. The key is the value to compare

                against `variable` (after applying `transform`); the value is the array of methods

                to run on match.'
            default:
              description: 'Array of SWML methods to execute if no `case` matches. If omitted and no case

                matches, execution stops with an error.'
              type: array
              items:
                $ref: '#/components/schemas/SWML.Messaging.SWMLMethod'
          required:
          - variable
          - case
          unevaluatedProperties:
            not: {}
          description: 'Branch on a variable''s value, with optional text transforms applied before matching.

            Useful for keyword-driven inbound message handling.'
          title: switch
      unevaluatedProperties:
        not: {}
      title: switch Method
    SWML.Messaging.SwitchTransform:
      type: string
      enum:
      - lowercase
      - uppercase
      - trim
      - lowercase_trim
      - uppercase_trim
      description: Transform applied to the variable value before matching.
      title: SwitchTransform enum
    SWML.Messaging.Transfer:
      type: object
      required:
      - transfer
      properties:
        transfer:
          type: object
          properties:
            dest:
              type: string
              format: uri
              description: 'URL (`http` or `https`) to fetch the new SWML document from. Authentication can

                be embedded in the URL as `username:password@url`.'
              examples:
              - https://example.com/handler
            method:
              type: string
              enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              description: HTTP method for the fetch request.
              examples:
              - POST
              default: POST
            params:
              type: object
              unevaluatedProperties: {}
              description: Parameters to include in the request body of the fetch. Available as `params.*` in the transferred document.
              examples:
              - reason: escalation
          required:
          - dest
          unevaluatedProperties:
            not: {}
          description: 'Fetch and execute a new SWML document from a URL. SignalWire POSTs the

            [inbound message webhook payload](/docs/apis/rest/webhooks/inbound-message-webhook)

            to `dest`: `message` describes the original inbound message, `params` carries

            the values supplied here, and `vars` carries the propagated runtime variables

            (`request_result`, `reply_result`, etc.) accumulated by the current document.


            This is a tail call — it replaces the current document and does not return.

            Steps after `transfer` are skipped, including steps in calling sections. In the

            messaging context, `transfer.dest` must be a URL — section names and inline

            documents are not accepted.'
          title: transfer
      unevaluatedProperties:
        not: {}
      title: transfer Method
