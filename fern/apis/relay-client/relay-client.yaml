                    - {}
                  description: The message text. `null` on `conversation.message.updated`.
                conversation_name:
                  oneOf:
                    - type: string
                    - {}
                  description: Human-readable name of the conversation. May be `null`.
                user_name:
                  type: string
                  description: Display name of the sender.
                details:
                  type: object
                  additionalProperties: {}
                  description: Additional message details.
                metadata:
                  type: object
                  additionalProperties: {}
                  description: Customer-provided metadata for the message.
                group_id:
                  type: string
                  description: Identifier of the conversation group.
                from_fabric_address_id:
                  type: string
                  description: The Resource address the message was sent from.
                hidden:
                  oneOf:
                    - type: boolean
                    - type: string
                      enum:
                        - "true"
                    - type: string
                      enum:
                        - "false"
                  description: Whether the message is hidden. On `conversation.message` this may arrive as the string `"false"` rather than a boolean.
              description: The event-specific payload.
          required:
            - event_type
            - event_channel
            - timestamp
            - is_author
            - params
          description: The event envelope.
      required:
        - jsonrpc
        - id
        - method
        - params
      description: |-
        Fires when a previously published conversation message is edited. `params` carries the
        updated, merged message payload and stream metadata; `subtype` is `update` and `text`
        is `null`. The envelope `timestamp` is a string of Unix milliseconds, for example
        `"1712345678842"`.
    Fabric.ConversationJoinedEvent:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
          description: JSON-RPC version. Always `2.0`.
        id:
          type: string
          description: "Event id — a unique UUID generated for each event. Events are notifications: you do not reply to them."
          examples:
            - 7d1e2f3a-4b5c-4d6e-8f9a-0b1c2d3e4f5a
        method:
          type: string
          enum:
            - signalwire.event
          description: Always `signalwire.event`.
        params:
          type: object
          properties:
            event_type:
              type: string
              enum:
                - conversation.joined
              description: The event type — identifies which event this is.
            event_channel:
              type: string
              description: The subscriber's Conversation stream this event was delivered on.
            timestamp:
              type: string
              description: |-
                When the event was emitted, as a string-encoded epoch timestamp. The unit
                differs by event: `conversation.message` and `conversation.joined` send
                fractional seconds (e.g. `"1712345678.842113"`); `conversation.message.updated`
                and `conversation.broadcast` send milliseconds (e.g. `"1712345678842"`).
              examples:
                - "1712345678.842113"
            is_author:
              type: boolean
              description: Whether the receiving subscriber authored this message.
              examples:
                - true
            params:
              description: The event-specific payload.
              allOf:
                - $ref: "#/components/schemas/Fabric.ConversationJoinedParams"
          required:
            - event_type
            - event_channel
            - timestamp
            - is_author
            - params
          description: The event envelope.
      required:
        - jsonrpc
        - id
        - method
        - params
      description: |-
        Fires when a subscriber is added to a conversation. `params` identifies the subscriber, the
        originating address, and the conversation group and name. The envelope `timestamp` is a
        string of Unix seconds with a fractional part, for example `"1712345678.842"`.
    Fabric.ConversationJoinedParams:
      type: object
      properties:
        fabric_subscriber_id:
          type: string
          description: The subscriber that joined the conversation.
          examples:
            - b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e
        from_fabric_address_id:
          type: string
          description: The Resource address the subscriber joined from.
          examples:
            - c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
        group_id:
          type: string
          description: Identifier of the conversation group that was joined.
          examples:
            - d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f90
        conversation_name:
          type: string
          description: Human-readable name of the conversation.
          examples:
            - Sales thread
      required:
        - fabric_subscriber_id
        - from_fabric_address_id
        - group_id
        - conversation_name
      description: "Payload of the `conversation.joined` event: the subscriber and conversation joined."
    Fabric.ConversationBroadcastEvent:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
          description: JSON-RPC version. Always `2.0`.
        id:
          type: string
          description: "Event id — a unique UUID generated for each event. Events are notifications: you do not reply to them."
          examples:
            - 7d1e2f3a-4b5c-4d6e-8f9a-0b1c2d3e4f5a
        method:
          type: string
          enum:
            - signalwire.event
          description: Always `signalwire.event`.
        params:
          type: object
          properties:
            event_type:
              type: string
              enum:
                - conversation.broadcast
              description: The event type — identifies which event this is.
            event_channel:
              type: string
              description: The subscriber's Conversation stream this event was delivered on.
            timestamp:
              type: string
              description: |-
                When the event was emitted, as a string-encoded epoch timestamp. The unit
                differs by event: `conversation.message` and `conversation.joined` send
                fractional seconds (e.g. `"1712345678.842113"`); `conversation.message.updated`
                and `conversation.broadcast` send milliseconds (e.g. `"1712345678842"`).
              examples:
                - "1712345678.842113"
            params:
              type: object
              properties: {}
              description: The event-specific payload.
          required:
            - event_type
            - event_channel
            - timestamp
            - params
          description: The event envelope.
      required:
        - jsonrpc
        - id
        - method
        - params
      description: |-
        Fires when a message is broadcast to every subscriber who shares a conversation with the
        sending address. `params` carries the merged broadcast payload and stream metadata. The
        envelope `timestamp` is a string of Unix milliseconds, for example `"1712345678842"`.
