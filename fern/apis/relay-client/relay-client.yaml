    Fabric.ConversationMessageEvent:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
          description: JSON-RPC version. Always `2.0`.
        id:
          type: string
          description: "Event id — a unique UUID generated for each event. Events are notifications: you do not reply to them."
          examples:
            - 7d1e2f3a-4b5c-4d6e-8f9a-0b1c2d3e4f5a
        method:
          type: string
          enum:
            - signalwire.event
          description: Always `signalwire.event`.
        params:
          type: object
          properties:
            event_type:
              type: string
              enum:
                - conversation.message
              description: The event type — identifies which event this is.
            event_channel:
              type: string
              description: The subscriber's Conversation stream this event was delivered on.
            timestamp:
              type: string
              description: |-
                When the event was emitted, as a string-encoded epoch timestamp. The unit
                differs by event: `conversation.message` and `conversation.joined` send
                fractional seconds (e.g. `"1712345678.842113"`); `conversation.message.updated`
                and `conversation.broadcast` send milliseconds (e.g. `"1712345678842"`).
              examples:
                - "1712345678.842113"
            is_author:
              type: boolean
              description: Whether the receiving subscriber authored this message.
              examples:
                - true
            params:
              type: object
              properties:
                id:
                  type: string
                  description: The message ID.
                type:
                  type: string
                  description: The message type.
                subtype:
                  type: string
                  description: The message subtype. Always `update` on `conversation.message.updated`.
                kind:
                  type: string
                  description: The message kind.
                ts:
                  type: number
                  format: double
                  description: When the message was created, as a Unix timestamp in seconds with a fractional part.
                  examples:
                    - 1712345678.842113
                text:
                  oneOf:
                    - type: string
                    - {}
                  description: The message text. `null` on `conversation.message.updated`.
                conversation_name:
                  oneOf:
                    - type: string
                    - {}
                  description: Human-readable name of the conversation. May be `null`.
                user_name:
                  type: string
                  description: Display name of the sender.
                details:
                  type: object
                  additionalProperties: {}
                  description: Additional message details.
                metadata:
                  type: object
                  additionalProperties: {}
                  description: Customer-provided metadata for the message.
                group_id:
                  type: string
                  description: Identifier of the conversation group.
                from_fabric_address_id:
                  type: string
                  description: The Resource address the message was sent from.
                hidden:
                  oneOf:
                    - type: boolean
                    - type: string
                      enum:
                        - "true"
                    - type: string
                      enum:
                        - "false"
                  description: Whether the message is hidden. On `conversation.message` this may arrive as the string `"false"` rather than a boolean.
              description: The event-specific payload.
          required:
            - event_type
            - event_channel
            - timestamp
            - is_author
            - params
          description: The event envelope.
      required:
        - jsonrpc
        - id
        - method
        - params
      description: |-
        Fires on a subscriber's Conversation stream when a new message is published to a
        conversation the subscriber is part of. `params` carries the merged message payload and
        stream metadata. The envelope `timestamp` is a string of Unix seconds with a fractional
        part, for example `"1712345678.842113"`.
