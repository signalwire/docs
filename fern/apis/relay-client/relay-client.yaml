          description: The parent call's `call_id`.
          examples:
            - e5c3f2b1-8d0a-4b4c-9f3e-2a1b0c9d8e7f
        node_id:
          type: string
          description: The node the parent call leg lives on.
          examples:
            - a3f1c2d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
      description: The call that created this one.
    Fabric.FabricSipData:
      type: object
      properties:
        sip_req_user:
          type: string
          description: User part of the SIP Request-URI.
        sip_req_uri:
          type: string
          description: The SIP Request-URI.
        sip_req_host:
          type: string
          description: Host part of the SIP Request-URI.
        sip_from_user:
          type: string
          description: User part of the SIP `From` header.
        sip_from_uri:
          type: string
          description: The SIP `From` URI.
        sip_from_host:
          type: string
          description: Host part of the SIP `From` header.
        sip_to_user:
          type: string
          description: User part of the SIP `To` header.
        sip_to_uri:
          type: string
          description: The SIP `To` URI.
        sip_to_host:
          type: string
          description: Host part of the SIP `To` header.
        sip_contact_user:
          type: string
          description: User part of the SIP `Contact` header.
        sip_contact_port:
          type: string
          description: Port of the SIP `Contact` header.
        sip_contact_uri:
          type: string
          description: The SIP `Contact` URI.
        sip_contact_host:
          type: string
          description: Host part of the SIP `Contact` header.
        sip_from_params:
          type: object
          additionalProperties:
            type: string
          description: URI parameters of the `From` header, as name/value pairs.
        sip_to_params:
          type: object
          additionalProperties:
            type: string
          description: URI parameters of the `To` header, as name/value pairs.
        sip_contact_params:
          type: object
          additionalProperties:
            type: string
          description: URI parameters of the `Contact` header, as name/value pairs.
        sip_req_params:
          type: object
          additionalProperties:
            type: string
          description: URI parameters of the Request-URI, as name/value pairs.
        sip_p_asserted_identity:
          type: string
          description: The raw `P-Asserted-Identity` header.
      description: SIP signaling details for a SIP call leg. Each field is present only when the call carried it.
