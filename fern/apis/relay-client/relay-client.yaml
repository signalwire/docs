          type: boolean
          description: Whether the member's video is muted.
        handraised:
          type: boolean
          description: Whether the member has their hand raised.
        visible:
          type: boolean
          description: Whether the member is visible in the layout.
        deaf:
          type: boolean
          description: Whether the member is deafened (not hearing the conference audio).
        input_volume:
          type: number
          format: double
          description: Input (microphone) volume, in decibels, from -50 to 50. May be fractional.
