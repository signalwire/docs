        connection open.
    Signalwire.ReauthenticateResult:
      type: object
      properties:
        authorization:
          type: object
          additionalProperties: {}
          description: The refreshed authorization granted to this connection. Treat it as opaque. Absent for a Subscriber Access Token — your refreshed state arrives on the `signalwire.authorization.state` event instead.
        authentication:
          type: string
          description: Always an empty string when present. Sent for every token except a Subscriber Access Token; ignore it.
          examples:
            - ""
        ice_servers:
          type: array
          items:
            $ref: "#/components/schemas/Signalwire.IceServer"
