    Fabric.CallStateEvent:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
          description: JSON-RPC version. Always `2.0`.
        id:
          type: string
          description: "Event id — a unique UUID generated for each event. Events are notifications: you do not reply to them."
          examples:
            - 7d1e2f3a-4b5c-4d6e-8f9a-0b1c2d3e4f5a
        method:
          type: string
          enum:
            - signalwire.event
          description: Always `signalwire.event`.
        params:
          type: object
          properties:
            event_type:
              type: string
              enum:
                - call.state
              description: The event type — identifies which event this is.
            event_channel:
              type: string
              description: |-
                The channel the event was delivered on — for Calling events, the `protocol`
                string your connection received from `signalwire.connect`.
              examples:
                - signalwire_c1d2e3f4a5b6
            timestamp:
              type: number
              format: double
              description: When the event was emitted, as a Unix timestamp in seconds. Always present.
              examples:
                - 1712345678.842
            project_id:
              type: string
              description: Your project ID. Present on Calling events and most Call Fabric events; absent on `call.joined`, `call.left`, `member.joined`, and `member.left`.
              examples:
                - b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e
            space_id:
              type: string
              description: Your space ID. Present on Calling events and most Call Fabric events; absent on `call.joined`, `call.left`, `member.joined`, and `member.left`.
              examples:
                - c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
            params:
              description: The event-specific payload.
              allOf:
                - $ref: "#/components/schemas/Fabric.CallStateParams"
          required:
            - event_type
            - event_channel
            - timestamp
            - params
          description: The event envelope.
      required:
        - jsonrpc
        - id
        - method
        - params
      description: |-
        Fires every time a Call Fabric call leg changes state — created, ringing, answered,
        ending, ended. Track the call through its lifecycle with `call_state`, and match `tag`
        to the call you created.
    Fabric.CallStateParams:
      type: object
      properties:
        call_id:
          type: string
          description: The call this event is about.
          examples:
            - c2a1e9f4-6b3d-4e7a-8f1c-2d3e4f5a6b7c
        node_id:
          type: string
          description: The node the call leg lives on.
          examples:
            - a3f1c2d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        room_session_id:
          type: string
          description: The room session this call leg belongs to. In a 1:1 call this is the call ID.
        segment_id:
          type: string
          description: Identifier of the call segment this event belongs to, for correlating events within the same segment.
          examples:
            - e5c3f2b1-8d0a-4b4c-9f3e-2a1b0c9d8e7f
        tag:
          type: string
          description: The `tag` you set when creating the call, echoed back so you can match the event to your request.
          examples:
            - my-tag-1
        call_state:
          description: The state the call has just moved into.
          examples:
            - answered
          allOf:
            - $ref: "#/components/schemas/Fabric.FabricCallState"
        direction:
          type: string
          description: Whether the call is inbound or outbound.
          examples:
            - outbound
        start_time:
          type: integer
          format: int64
          description: When the call started, as a Unix timestamp in milliseconds. `0` until known.
          examples:
            - 1712345678123
        answer_time:
          type: integer
          format: int64
          description: When the call was answered, as a Unix timestamp in milliseconds. `0` until the call is answered.
          examples:
            - 1712345680456
        end_time:
          type: integer
          format: int64
          description: When the call ended, as a Unix timestamp in milliseconds. `0` until the call ends.
          examples:
            - 0
        end_reason:
          type: string
          description: "Why the call ended: one of `hangup`, `cancel`, `busy`, `decline`, `noAnswer`, `error`, `abandoned`, `maxDuration`, or `notFound`. Present once an end reason is known."
          examples:
            - hangup
        end_source:
          type: string
          enum:
            - inbound
            - outbound
            - none
          description: "Which side ended the call: `inbound`, `outbound`, or `none` when it could not be determined. Present together with `end_reason`."
          examples:
            - outbound
        dial_winner:
          type: string
          enum:
            - "true"
          description: Set to the string `"true"` on the call leg that won a dial race. Absent otherwise. Note the value is the string `"true"`, not a JSON boolean.
          examples:
            - "true"
        audio_in_mos:
          type: number
          format: double
          description: Inbound-audio Mean Opinion Score (voice quality), as a decimal such as `4.42`. Present when RTP quality stats are available.
          examples:
            - 4.42
        device:
          description: The device handling this call leg.
          allOf:
            - $ref: "#/components/schemas/Fabric.FabricCallDevice"
        peer:
          description: Present when this leg is directly connected to another call.
          allOf:
            - $ref: "#/components/schemas/Fabric.FabricPeerRef"
        parent:
          description: Present when this call was created by another call.
          allOf:
            - $ref: "#/components/schemas/Fabric.FabricParentRef"
        sip_data:
          description: SIP signaling details. Present on SIP call legs.
          allOf:
            - $ref: "#/components/schemas/Fabric.FabricSipData"
        address_id:
          type: string
          description: The Resource address the call is associated with. Present on subscriber call legs.
        subscriber_id:
          type: string
          description: The subscriber the call belongs to. Present on subscriber call legs.
        subscriber_name:
          type: string
          description: The subscriber's display name. Present on subscriber call legs when set.
      required:
        - call_id
        - node_id
        - room_session_id
        - call_state
        - direction
        - start_time
        - answer_time
        - end_time
        - device
      description: "Payload of the Call Fabric `call.state` event: a call leg's address, state, timing, and connection detail."
    Fabric.FabricCallState:
      type: string
      enum:
        - created
        - ringing
        - answered
        - ending
        - ended
    Fabric.FabricCallDevice:
      type: object
      properties:
        type:
          type: string
          description: The device type, such as `phone`, `sip`, or `webrtc`.
          examples:
            - webrtc
        params:
          type: object
          additionalProperties: {}
          description: Device-specific parameters.
      required:
        - type
      description: The device handling a Call Fabric call leg.
    Fabric.FabricPeerRef:
      type: object
      properties:
        call_id:
          type: string
          description: The peer call's `call_id`.
