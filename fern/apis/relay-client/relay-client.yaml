        message:
          type: object
          additionalProperties: {}
          description: |-
            The Verto frame to send — a JSON-RPC 2.0 object `{ jsonrpc, id, method, params }`,
            passed through as-is. See `webrtc.verto` for the frame format.
          examples:
            - jsonrpc: "2.0"
              id: 6c413717-7595-4c86-9586-506bcc3abd7a
              method: verto.bye
              params:
                dialogParams:
                  callID: 2689709c-5c02-4db3-9df9-81cdd9005209
        node_id:
          type: string
          description: |-
            The node hosting the call. Omit it on a `verto.invite`; required on every other
            frame — use the `node_id` from the invite's reply or a later event.
          examples:
            - a3f1c2d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
      required:
        - message
      description: "The parameters for a `webrtc.message` request: the Verto frame to send and the `node_id` hosting the call."
    WebRTC.WebRTCMessageReply:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
          description: JSON-RPC version. Always `2.0`.
        id:
          type: string
          description: The id of the request this responds to.
        result:
          description: The method result. Present when the request succeeded.
          allOf:
            - $ref: "#/components/schemas/WebRTC.WebRTCMessageResult"
        error:
          description: Present instead of `result` when the request failed at the protocol level.
          allOf:
            - $ref: "#/components/schemas/JsonRpcError"
      required:
        - jsonrpc
        - id
      description: |-
        A JSON-RPC response frame correlated to a request by `id`. On success the frame carries
        `result` (the method result). If the request fails at the protocol level — an
        incompatible version, failed authentication, insufficient scope, invalid params, or the
        service being at capacity — the frame carries `error` instead of `result`. Many
        method-level failures (for example most Calling failures) are reported the other way: a
