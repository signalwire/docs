        any token other than a Subscriber Access Token, your refreshed `authorization`. A
        `signalwire.authorization.state` event is delivered alongside it carrying your
        refreshed authorization state — save its `authorization_state` as usual.
    WebRTC.VertoRequest:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
          description: JSON-RPC version. Always `2.0`.
        id:
          type: string
          description: Request id, echoed on the correlated response.
        method:
          type: string
          enum:
            - webrtc.verto
          description: The name of the JSON-RPC method being invoked.
        params:
          description: The method's input parameters.
          allOf:
            - $ref: "#/components/schemas/WebRTC.VertoParams"
      required:
        - jsonrpc
        - id
        - method
        - params
      description: A JSON-RPC request frame. `Method` is the method name; `Params` is the method's input.
    WebRTC.VertoParams:
      type: object
      properties:
        node_id:
          type: string
          description: |-
            The node currently hosting your call. Once a call exists, set this to the
            `node_id` you received in an earlier event or response so the frame reaches
            the right node. Leave it absent on your first message, before a call has been
            established — SignalWire assigns one for you.
          examples:
            - a3f1c2d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        message:
          type: object
          additionalProperties: {}
          description: |-
            The Verto frame (the WebRTC signaling message format used for peer calls) to
            send — a JSON-RPC 2.0 object `{ jsonrpc, id, method, params }`. For a
            `verto.invite`, `params` carries your `sdp` (the Session Description Protocol
            offer) and a `dialogParams` object; `layout` and `positions` apply only when
            inviting into a conference. Each frame is a Verto-protocol signaling message
            whose `params` depend on the Verto method it carries, and SignalWire passes it
            through as-is. The Verto call ID belongs inside this frame, at
            `dialogParams.callID` — generate one when you create a call and reuse it on
            every frame for that call. There is no top-level `callID`.
          examples:
            - jsonrpc: "2.0"
              id: 6c413717-7595-4c86-9586-506bcc3abd7a
              method: verto.invite
              params:
                sdp: "v=0\r

                  o=- 4363463200085990471 2 IN IP4 127.0.0.1\r

                  s=-\r

                  t=0 0\r

                  ... (your WebRTC SDP offer) ..."
                dialogParams:
                  callID: 2689709c-5c02-4db3-9df9-81cdd9005209
                  destination_number: "1003"
                  caller_id_name: SW JS client
                  caller_id_number: user@example.com
                  audio: true
                  video: true
        subscribe:
          type: array
          items:
            type: string
          description: |-
            Event channels to subscribe to alongside this request — useful when you
            join a conference and want its event feed. Values are conference/room event
            channels such as `member.joined`, `member.left`, `room.ended`,
            `room.updated`, `layout.changed`, and `member.updated` (illustrative, not
            exhaustive).
          examples:
            - - member.joined
              - member.left
              - room.ended
      required:
        - message
      description: "The parameters for a `webrtc.verto` request: the Verto frame to send, the `node_id` that scopes it to your call, and any event channels to subscribe to."
    WebRTC.VertoReply:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
          description: JSON-RPC version. Always `2.0`.
        id:
          type: string
          description: The id of the request this responds to.
        result:
          description: The method result. Present when the request succeeded.
          allOf:
            - $ref: "#/components/schemas/WebRTC.VertoResult"
        error:
          description: Present instead of `result` when the request failed at the protocol level.
          allOf:
            - $ref: "#/components/schemas/JsonRpcError"
      required:
        - jsonrpc
        - id
      description: |-
        A JSON-RPC response frame correlated to a request by `id`. On success the frame carries
        `result` (the method result). If the request fails at the protocol level — an
        incompatible version, failed authentication, insufficient scope, invalid params, or the
        service being at capacity — the frame carries `error` instead of `result`. Many
        method-level failures (for example most Calling failures) are reported the other way: a
        normal `result` whose own `code` is not `"200"`. Each method documents which form its
        failures take.

        An `error` returned for `signalwire.connect` is followed by the service closing the
        WebSocket; open a new connection to try again. Errors on any later request leave the
        connection open.
    WebRTC.VertoResult:
      type: object
      properties:
        code:
          type: string
          description: |-
            Result code as a string. `"200"` means success. On failure this is a lowercase
            error identifier such as `not_allowed`, `invalid_params`, `internal_error`, or
            `response_timeout`. Always check `code` to tell success from failure.
          examples:
            - "200"
        result:
          type: object
          additionalProperties: {}
          description: The Verto reply payload — for example the answer to a `verto.invite`. The shape depends on the Verto method.
        message:
          type: string
          description: A human-readable status message. Present on errors and on some informational replies.
          examples:
            - Received
        node_id:
          type: string
          description: The node now hosting the call. Capture it and send it on later frames for this call.
          examples:
            - a3f1c2d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
      required:
        - code
      description: "The reply to your Verto frame: the Verto outcome plus the node now hosting the call."
    WebRTC.WebRTCMessageRequest:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
